<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Tree - Hands</title>
<style>
html, body { margin: 0; height: 100%; background: #1b2242; overflow: hidden; }
canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ============================== helpers ============================== */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const COLS = 124;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const smooth = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOutCubic = t => { t = clamp01(t); return 1 - Math.pow(1 - t, 3); };
const easeOutBack = t => {
  t = clamp01(t);
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeInOut15 = g => (g < 0.5 ? Math.pow(2 * g, 1.5) / 2 : 1 - Math.pow(2 * (1 - g), 1.5) / 2);
const easeInOut15Inv = e => (e < 0.5 ? Math.pow(2 * e, 1 / 1.5) / 2 : 1 - Math.pow(2 * (1 - e), 1 / 1.5) / 2);
/* the tree rises at an almost steady pace, quick off the mark, and is whole a little after 5.3 s */
const growF = t => easeInOut15(clamp01((t - 1.8) / 4.35)) * 1.12;
const tPassOf = f => 1.8 + 4.35 * easeInOut15Inv(clamp01(f / 1.12));

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function h2(x, y) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function h3(x, y, z) { return h2((x | 0) + Math.imul(z | 0, 7919), (y | 0) + Math.imul(z | 0, 104729)); }

/* colours are packed as 0xAARRGGBB */
function hsl(h, s, l, a) {
  h = ((h % 360) + 360) % 360;
  s = clamp01(s); l = clamp01(l);
  const c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (hp < 1) { r = c; g = x; } else if (hp < 2) { r = x; g = c; } else if (hp < 3) { g = c; b = x; }
  else if (hp < 4) { g = x; b = c; } else if (hp < 5) { r = x; b = c; } else { r = c; b = x; }
  const A = a === undefined ? 255 : (clamp01(a) * 255 + 0.5) | 0;
  return ((A << 24) | ((((r + m) * 255 + 0.5) | 0) << 16) | ((((g + m) * 255 + 0.5) | 0) << 8) | (((b + m) * 255 + 0.5) | 0)) >>> 0;
}
function rgba(r, g, b, a) {
  const A = a === undefined ? 255 : (clamp01(a) * 255 + 0.5) | 0;
  return ((A << 24) | (r << 16) | (g << 8) | b) >>> 0;
}
const HUE_STOPS = [318, 282, 228, 190, 150, 56, 38, 56, 150, 190, 228, 282, 318];
function rampHue(p) {
  p = fract(p) * 12;
  const i = Math.min(11, Math.floor(p));
  return lerp(HUE_STOPS[i], HUE_STOPS[i + 1], p - i);
}
/* light colour: yellows and golds are pulled toward amber so they do not glare */
function lightCol(h, l, a) {
  let s = 1;
  if (h < 100) { const k = smooth((100 - h) / 45); s = 1 - 0.34 * k; l -= 0.05 * k; }
  return hsl(h, s, l, a);
}

const c_hash = 35, c_at = 64, c_pct = 37, c_amp = 38, c_8 = 56, c_plus = 43, c_star = 42, c_dot = 46;
const c_colon = 58, c_eq = 61, c_minus = 45, c_pipe = 124, c_slash = 47, c_bslash = 92, c_o = 111;
const c_0 = 48, c_O = 79, c_x = 120, c_apos = 39, c_under = 95, c_lt = 60, c_3 = 51;
const CHS = [];
for (let i = 0; i < 128; i++) CHS.push(String.fromCharCode(i));
const SPACES = ['', ' ', '  ', '   ', '    ', '     ', '      ', '       ', '        '];
const TREE_GLYPHS = [c_8, c_amp, c_pct, c_hash, c_at];
const WHITE = rgba(252, 252, 255);

/* ============================== canvas and grid ============================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lay = document.createElement('canvas'), lctx = lay.getContext('2d');
const bgc = document.createElement('canvas'), bgx = bgc.getContext('2d');
const bl1 = document.createElement('canvas'), bl1x = bl1.getContext('2d');
const bl2 = document.createElement('canvas'), bl2x = bl2.getContext('2d');
const bl3 = document.createElement('canvas'), bl3x = bl3.getContext('2d');
const tintC = document.createElement('canvas'), tintX = tintC.getContext('2d');
let tintImg = null, tintPx = new Uint32Array(1), glowImg = null, glowPx = new Uint32Array(1);
let rowText = false, textOff = 0;

let dpr = 1, W = 2, H = 2, PW = 2, CW = 1, CH = 1.62, AR = 1 / 1.62, rows = 1, gcols = COLS, extra = 0;
let gridX0 = 0, stageX = 0, cxc = 61.5;
let chA = new Uint8Array(1), colA = new Uint32Array(1), depA = new Float32Array(1), dimA = new Float32Array(1);
let tZ = new Float32Array(1), tRs = new Float32Array(1), tGs = new Float32Array(1), tBs = new Float32Array(1);
let tWs = new Float32Array(1), tBd = new Float32Array(1), tYg = new Float32Array(1), tFs = new Float32Array(1);
let crossX = new Float32Array(8), crossN = new Uint8Array(1);
let floorRow = 0, baseRow = 0, tipRow = 0, treeH = 1, tilt = 0.1, ftilt = 0.17;
const TR = 0.32 * COLS;
const FFLOOR = -(0.845 - 0.724) / (0.724 - 0.273);

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(2, Math.floor(window.innerWidth * dpr));
  H = Math.max(2, Math.floor(window.innerHeight * dpr));
  cv.width = W; cv.height = H;
  PW = Math.min(W, H * 9 / 16);
  CW = PW / COLS; CH = CW * 1.62; AR = CW / CH;
  rows = Math.max(1, Math.floor(H / CH));
  stageX = (W - PW) / 2;
  extra = Math.max(0, Math.ceil(stageX / CW - 1e-6));
  gcols = COLS + 2 * extra;
  gridX0 = stageX - extra * CW;
  cxc = extra + 61.5;
  const n = gcols * rows;
  chA = new Uint8Array(n); colA = new Uint32Array(n); depA = new Float32Array(n); dimA = new Float32Array(n);
  tZ = new Float32Array(n); tRs = new Float32Array(n); tGs = new Float32Array(n); tBs = new Float32Array(n);
  tWs = new Float32Array(n); tBd = new Float32Array(n); tYg = new Float32Array(n); tFs = new Float32Array(n);
  crossX = new Float32Array(rows * 8); crossN = new Uint8Array(rows);
  floorRow = 0.845 * rows; baseRow = 0.724 * rows; tipRow = 0.273 * rows; treeH = baseRow - tipRow;
  tilt = 0.17 * AR; ftilt = 0.28 * AR;
  lay.width = W; lay.height = H;
  tintC.width = gcols; tintC.height = rows;
  tintImg = tintX.createImageData(gcols, rows);
  tintPx = new Uint32Array(tintImg.data.buffer);
  bgc.width = W; bgc.height = H;
  bl1.width = gcols; bl1.height = rows;
  bl2.width = Math.max(1, gcols >> 1); bl2.height = Math.max(1, rows >> 1);
  bl3.width = Math.max(1, gcols >> 2); bl3.height = Math.max(1, rows >> 2);
  glowImg = bl1x.createImageData(gcols, rows);
  glowPx = new Uint32Array(glowImg.data.buffer);
  const gr = bgx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#050816'); gr.addColorStop(0.5, '#0a1026');
  gr.addColorStop(0.84, '#111a36'); gr.addColorStop(1, '#1b2242');
  bgx.fillStyle = gr; bgx.fillRect(0, 0, W, H);
  lctx.font = 'bold ' + (0.95 * CH).toFixed(2) + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
  /* where the browser can space letters, a whole row is drawn as one string: the letter spacing is set so that
     every character lands exactly on its cell */
  rowText = 'letterSpacing' in lctx;
  if (rowText) {
    lctx.letterSpacing = '0px';
    if ('fontKerning' in lctx) lctx.fontKerning = 'none';
    const adv = lctx.measureText('MMMMMMMMMMMMMMMMMMMM').width / 20;
    lctx.letterSpacing = (CW - adv).toFixed(4) + 'px';
    lctx.textAlign = 'left';
    textOff = (CW - adv) / 2;
  }
}

function put(x, y, ch, col, z) {
  x = Math.floor(x + 0.5); y = Math.floor(y + 0.5);
  if (x < 0 || x >= gcols || y < 0 || y >= rows) return;
  const i = y * gcols + x;
  if (z >= depA[i]) { depA[i] = z; chA[i] = ch; colA[i] = col; }
}

/* halos: characters sprinkled into empty cells around bright sources */
const HMAX = 16;
const haX = new Float32Array(HMAX), haY = new Float32Array(HMAX), haR = new Float32Array(HMAX), haS = new Float32Array(HMAX);
const haC = new Uint32Array(HMAX);
let nHalo = 0;
function addHalo(x, y, r, s, col) {
  if (nHalo >= HMAX || s <= 0.01) return;
  haX[nHalo] = x; haY[nHalo] = y; haR[nHalo] = r; haS[nHalo] = s; haC[nHalo] = col; nHalo++;
}
function drawHalos() {
  const tk = Math.floor(tReal * 9);
  for (let k = 0; k < nHalo; k++) {
    const R = haR[k], hx = haX[k], hy = haY[k], st = haS[k], col = haC[k];
    const y0 = Math.max(0, Math.floor(hy - R * AR)), y1 = Math.min(rows - 1, Math.ceil(hy + R * AR));
    const x0 = Math.max(0, Math.floor(hx - R)), x1 = Math.min(gcols - 1, Math.ceil(hx + R));
    for (let y = y0; y <= y1; y++) {
      const dy = (y - hy) / AR;
      for (let x = x0; x <= x1; x++) {
        const i = y * gcols + x;
        if (chA[i] !== 0) continue;
        const dx = x - hx, d = Math.sqrt(dx * dx + dy * dy);
        if (d > R) continue;
        const q = 1 - d / R;
        if (h3(x, y, tk + k * 31) < st * q * q) {
          chA[i] = d < R * 0.33 ? c_plus : d < R * 0.66 ? c_colon : c_dot;
          colA[i] = (col & 0xffffff) | ((((0.35 + 0.65 * q) * 255) | 0) << 24);
        }
      }
    }
  }
}

/* ============================== clocks and state ============================== */
let state = 'start';
let mode = 'idle';
let paused = false;
let tReal = 0, T = 0, prevT = 0, Tlimit = 0, stage = 0, treeT = 0;
let lastMs = 0;
let pending = null;
let ignoreUntil = 0;
let quality = 4, emaDt = 5, slowT = 0;
const STAGE_END = [0, 1.5, 5.6, 6.25, 9.25, 10.8, Infinity];
const twists = [];
let twistDir = 1, twistCool = 0;

function motionDone() { return T >= Tlimit - 1e-4; }
function twistExtra() {
  let e = 0;
  for (let i = 0; i < twists.length; i++) e += (Math.PI / 3) * easeOutCubic((tReal - twists[i]) / 1.5);
  return e;
}
function doTwist() {
  if (state !== 'film' || T <= 2.1) return;
  twists.push(tReal);
  if (twists.length > 12) twists.shift();
}

/* ============================== static scene data ============================== */
const tR = [1.15, 0.92, 0.74, 0.57, 0.39, 0.22];
const tFb = [0, 0.205, 0.385, 0.545, 0.685, 0.81];
const tFt = [0.265, 0.445, 0.605, 0.745, 0.87, 1.0];
const tLobes = [13, 11, 10, 8, 7, 6];
const tDepth = [0.15, 0.16, 0.17, 0.19, 0.21, 0.25];
const tDroop = [0.072, 0.046, 0.038, 0.03, 0.024, 0.015];
const LB = [], LLEN = [], LBR = [], LDR = [];
function prof(k, u) { return k < 5 ? 1 - 0.5 * Math.pow(u, 0.9) : Math.pow(Math.max(0, 1 - u), 0.8); }

let lobeI = 0, lobeShape = 0;
function lobeAt(k, a) {
  const b = LB[k], n = tLobes[k];
  a = a - Math.floor(a / TAU) * TAU;
  if (a < b[0]) a += TAU;
  let i = Math.min(n - 1, Math.max(0, Math.floor((a - b[0]) / TAU * n)));
  while (i > 0 && a < b[i]) i--;
  while (i < n - 1 && a >= b[i + 1]) i++;
  lobeI = i;
  const s = clamp01((a - b[i]) / (b[i + 1] - b[i]));
  lobeShape = Math.pow(Math.max(0, Math.sin(Math.PI * s)), 0.55);
}
function edgeF(k) { return LLEN[k][lobeI] * (1 - tDepth[k] * (1 - lobeShape)); }

const WT = new Float32Array(257);
function treeW(f) {
  if (f <= 0) return WT[0];
  if (f >= 1) return WT[256];
  const p = f * 256, i = Math.floor(p);
  return lerp(WT[i], WT[i + 1], p - i);
}

const NB = 100000, NL = 5000;
let pR, pSin, pCos, pF, pDr, pT, pB, pFr, pHv, pGj, pTintC, pTintT, pTintS, pSh, pK;
const tShadowT = new Float32Array(6), shK = new Float32Array(6);
const qIdx = new Int32Array(NB), qZ = new Float32Array(NB), qSp = new Float32Array(NB), qCp = new Float32Array(NB), qExt = new Float32Array(NB);
const lR = new Float32Array(NL), lSin = new Float32Array(NL), lCos = new Float32Array(NL), lFy = new Float32Array(NL);
const lB = new Uint16Array(NL);
let NBULB = 0;
let bOn, bHue, bPh, bSpd, bGl, bCol, bCh, bAng, bRad, bFy, bTier, bGold;
const baubles = [];
const COMET_A0 = 0.9;
const gR = new Uint8Array(8 * 64), gG = new Uint8Array(8 * 64), gBl = new Uint8Array(8 * 64);

function genTree() {
  const rng = mulberry(20251225);
  for (let k = 0; k < 6; k++) {
    const n = tLobes[k];
    const b = new Float32Array(n + 1), ln = new Float32Array(n), br = new Float32Array(n), dr = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      b[i] = (i + (rng() - 0.5) * 0.5) / n * TAU;
      ln[i] = 0.93 + 0.07 * rng();
      br[i] = 1.08 - (0.34 + 0.05 * k) * rng();
      dr[i] = 0.65 + 0.7 * rng();
    }
    b[n] = b[0] + TAU;
    LB.push(b); LLEN.push(ln); LBR.push(br); LDR.push(dr);
  }
  /* width envelope, smoothed so the ring and the comets move without jumps */
  const raw = new Float32Array(257);
  for (let i = 0; i <= 256; i++) {
    const f = i / 256;
    let w = 0;
    for (let k = 0; k < 6; k++) {
      if (f >= tFb[k] && f <= tFt[k]) w = Math.max(w, tR[k] * TR * prof(k, (f - tFb[k]) / (tFt[k] - tFb[k])));
    }
    raw[i] = w;
  }
  for (let i = 0; i <= 256; i++) {
    let s = 0, c = 0;
    for (let j = -9; j <= 9; j++) { const q = i + j; if (q >= 0 && q <= 256) { s += raw[q]; c++; } }
    WT[i] = s / c;
  }
  WT[256] = 0;

  /* green lookup: 8 hue variants x 64 brightness levels */
  for (let hv = 0; hv < 8; hv++) {
    for (let lv = 0; lv < 64; lv++) {
      const t = lv / 63;
      const c = hsl(174 - 44 * t + (hv - 3.5) * 2.4, 0.42 + 0.26 * t, 0.045 + 0.54 * t);
      gR[hv * 64 + lv] = (c >> 16) & 255; gG[hv * 64 + lv] = (c >> 8) & 255; gBl[hv * 64 + lv] = c & 255;
    }
  }

  /* bulbs: a rainbow string on each rim, a gold string just inside it */
  const B = [];
  const rainbowStart = [], rainbowCount = [];
  const SWAG = [7, 6, 5, 4, 3, 3], HTURN = [2, 2, 1, 1, 1, 1], HUE0 = [40, 200, 300, 120, 20, 180];
  const hf = 1 - FFLOOR;
  function onTime(f, a) {
    const sl = (1 - f) / hf;
    let best = 9;
    for (let c = 0; c < 2; c++) {
      let d = a - COMET_A0 - c * Math.PI;
      d = d - Math.floor(d / TAU) * TAU;
      const base = d / (8 * Math.PI);
      const s = base + 0.25 * Math.max(0, Math.ceil((sl - base) / 0.25));
      if (s < best) best = s;
    }
    return 6.25 + 3 * Math.min(best, 0.84);
  }
  for (let k = 0; k < 6; k++) {
    const nb = Math.max(8, Math.round(TAU * tR[k] * TR / 2.1));
    rainbowStart.push(B.length); rainbowCount.push(nb);
    for (let j = 0; j < nb; j++) {
      const a = (j + 0.5) / nb * TAU;
      lobeAt(k, a);
      const dr = tDroop[k] * LDR[k][lobeI] * (0.5 + 0.5 * lobeShape);
      const keep = h2(k + 3, Math.floor(j / 6) + 40) >= 0.04;
      /* the string hangs in swags between the branch tips, and its colour walks round the colour wheel,
         so neighbouring bulbs are always neighbouring colours */
      const drape = Math.sin(Math.PI * fract(a / TAU * SWAG[k] + k * 0.37));
      const fy = tFb[k] - dr * 0.5 + 0.006 - 0.03 * drape + 0.008 * Math.sin(a * 2 + k * 1.3);
      const hue = (HUE0[k] + a / TAU * 360 * HTURN[k] + 16 * (h2(k * 31 + 5, j * 3 + 1) - 0.5) + 720) % 360;
      B.push({ k: k, a: a, r: tR[k] * TR * edgeF(k) + 0.3, fy: fy, keep: keep, gold: 0,
        hue: hue, on: onTime(fy, a), sp: TAU / nb });
    }
    const ng = Math.max(5, Math.round(nb * 0.6));
    for (let j = 0; j < ng; j++) {
      const a = (j + 0.5) / ng * TAU + 0.013;
      lobeAt(k, a);
      const dr = tDroop[k] * LDR[k][lobeI] * (0.5 + 0.5 * lobeShape);
      const keep = h2(k + 11, Math.floor(j / 4) + 90) >= 0.18;
      /* the second strand crosses the first: its swags fall where the first one is pinned up */
      const drape = Math.sin(Math.PI * fract(a / TAU * SWAG[k] + k * 0.37 + 0.5));
      const fy = tFb[k] - dr * 0.5 + 0.012 - 0.024 * drape;
      const hue = (HUE0[k] + a / TAU * 360 * HTURN[k] + 38 + 720) % 360;
      B.push({ k: k, a: a, r: tR[k] * TR * edgeF(k) * 0.95, fy: fy, keep: keep, gold: 1,
        hue: hue, on: onTime(fy, a), sp: TAU / ng });
    }
  }
  NBULB = B.length;
  bOn = new Float32Array(NBULB); bHue = new Float32Array(NBULB); bPh = new Float32Array(NBULB);
  bSpd = new Float32Array(NBULB); bGl = new Uint8Array(NBULB); bCol = new Uint32Array(NBULB); bCh = new Uint8Array(NBULB);
  bAng = new Float32Array(NBULB); bRad = new Float32Array(NBULB); bFy = new Float32Array(NBULB);
  bTier = new Uint8Array(NBULB); bGold = new Uint8Array(NBULB);
  const bulbGl = [c_at, c_o, c_star, c_0];
  const keptR = [], keptG = [];
  for (let i = 0; i < NBULB; i++) {
    const b = B[i];
    bOn[i] = b.on; bHue[i] = b.hue; bPh[i] = rng() * TAU; bSpd[i] = 1.6 + 3.2 * rng();
    bGl[i] = bulbGl[Math.floor(rng() * 4)];
    bAng[i] = b.a; bRad[i] = b.r; bFy[i] = b.fy; bTier[i] = b.k; bGold[i] = b.gold;
    if (b.keep) { if (b.gold) keptG.push(i); else keptR.push(i); }
  }
  for (let i = 0; i < NL; i++) {
    const gold = rng() < 0.34;
    const list = gold ? keptG : keptR;
    const bi = list[Math.floor(rng() * list.length)];
    const b = B[bi];
    const a = b.a + (rng() - 0.5) * 0.5 * b.sp;
    lB[i] = bi;
    lR[i] = b.r + (rng() - 0.5) * 0.5;
    lSin[i] = Math.sin(a); lCos[i] = Math.cos(a);
    lFy[i] = b.fy + (rng() - 0.5) * 0.024;
  }

  /* body point cloud */
  const tw = [];
  let tws = 0;
  for (let k = 0; k < 6; k++) { const w = Math.pow(tR[k] * (tFt[k] - tFb[k]), 0.85); tw.push(w); tws += w; }
  const aR = new Float32Array(NB), aS = new Float32Array(NB), aC = new Float32Array(NB), aF = new Float32Array(NB);
  const aD = new Float32Array(NB), aT = new Float32Array(NB), aB = new Uint8Array(NB), aFr = new Uint8Array(NB);
  const aHv = new Uint8Array(NB), aGj = new Int8Array(NB), aTc = new Uint32Array(NB), aTt = new Float32Array(NB);
  const aTs = new Uint8Array(NB), aSh = new Uint8Array(NB).fill(255), aK = new Uint8Array(NB);
  /* the top of a tier only falls into shadow once the tier above it has grown over it */
  for (let k = 0; k < 6; k++) tShadowT[k] = k < 5 ? tPassOf(tFb[k + 1]) - 0.05 : 0;
  for (let i = 0; i < NB; i++) {
    let pick = rng() * tws, k = 0;
    while (k < 5 && pick > tw[k]) { pick -= tw[k]; k++; }
    const a = rng() * TAU;
    lobeAt(k, a);
    const ef = edgeF(k), lbr = LBR[k][lobeI], ldr = LDR[k][lobeI], shp = lobeShape;
    const core = rng() < 0.3;

/* ============================== drawing: snow, start screen ============================== */
function drawSnow() {
  const n = Math.min(NSNOW, Math.round(230 * gcols / COLS));
  for (let i = 0; i < n; i++) {
    const yy = fract(snY[i] + snV[i] * tReal) * rows - 0.5;
    const x = snX[i] * gcols - 0.5 + Math.sin(tReal * snW[i] + snP[i]) * 0.7;

    const y0 = Math.floor(yy), fy = smooth((yy - y0 - 0.3) / 0.4), c = snC[i], al = c >>> 24, rgb = c & 0xffffff;
    const ch = snV[i] < 0.027 ? c_dot : snV[i] < 0.045 ? c_plus : c_star;

function emitSnow(dt) {

/* ---- the heart magic circle ----
   white light on the snow. One large heart lies around the trunk, point toward the viewer, drawn as nested outlines;
   on every heartbeat two waves of light leave the trunk and run outward along those nested hearts.
   Around it: a sunburst of fine rays, a band that carries a procession of small hearts, and a double rim.
   The lines send a faint curtain of light upward, so the circle looks lit from within.
   It runs off both sides of the portrait stage on purpose, so it reads as a floor. */
const RD = 0.8 * COLS, NCHARM = 18;
let stageFlashT = -99, landReal = -99;
const HRT = new Float32Array(722);
let heartR = 1;
(function () {
  for (let i = 0; i < 8000; i++) {
    const t = i / 8000 * TAU, s = Math.sin(t);
    const px = 16 * s * s * s, py = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    let a = Math.atan2(px, py);
    if (a < 0) a += TAU;
    const b = Math.round(a / TAU * 720) % 720, r = Math.sqrt(px * px + py * py);
    if (r > HRT[b]) HRT[b] = r;
  }
  for (let i = 0; i < 720; i++) if (HRT[i] === 0) HRT[i] = HRT[(i + 719) % 720] || 5;
  HRT[720] = HRT[0]; HRT[721] = HRT[1];
})();
/* how far out a point lies on the heart: 1 on the outline, less inside */
function heartK(ux, uy) {
  let a = Math.atan2(ux, uy);
  if (a < 0) a += TAU;
  const p = a / TAU * 720, i = p | 0;
  heartR = HRT[i] + (HRT[i + 1] - HRT[i]) * (p - i);
  return Math.sqrt(ux * ux + uy * uy) / heartR;
}

function drawDisc(rot) {
  const tau = T - 0.39;

  const x0 = Math.max(0, Math.ceil(cxc - RD)), x1 = Math.min(gcols - 1, Math.floor(cxc + RD));
  const landF = Math.exp(-Math.max(0, tReal - landReal) * 2.6) * (tReal >= landReal ? 1 : 0);
  const sAge = tReal - stageFlashT;
  const sflash = sAge >= 0 ? Math.exp(-sAge * 2.4) : 0, sRing = sAge * 120;

    const dz = (y - floorRow) / ftilt;
    const uy = -(y - hRow) / HSY;
    for (let x = x0; x <= x1; x++) {
      const dx = x - cxc, d = Math.sqrt(dx * dx + dz * dz);
      if (d > RD || d > spread) continue;
      const rho = d / RD, inv = 1 / (d + 0.001);

      if (rho >= 0.957 - tol * 0.3) { ch = c_hash; L = 0.86; kind = 1; }
      else if (Math.abs(rho - 0.93) < 0.006 + tol * 0.45) { ch = c_eq; L = 0.72; kind = 2; }
      else if (Math.abs(rho - 0.812) < 0.005 + tol * 0.45) { ch = c_eq; L = 0.76; kind = 2; }

        else if (k < 1) {

          else if (Math.abs(k - 0.64) < tolK * 0.8) { if ((x & 1) === 0) { ch = c_plus; L = 0.88; kind = 4; } }
          else if (Math.abs(k - 0.4) < tolK * 0.8) { ch = c_colon; L = 0.86; kind = 4; }

            kind = 6;
          } else if (Math.abs(rho - 0.7) < 0.004 + tol * 0.4 && k > 1.08) { if ((x & 1) === 0) { ch = c_minus; L = 0.7; kind = 6; } }
          else if (Math.abs(rho - 0.6) < 0.004 + tol * 0.4 && k > 1.08) { if ((x % 3) === 0) { ch = c_dot; L = 0.72; kind = 6; } }
        }
      }
      if (kind) {
        L *= 0.9 + 0.1 * (dz / RD);
        if (kind === 1 || kind === 2) {
          let dd = ths - sweepA;
          dd -= Math.round(dd / TAU) * TAU;
          L += settled * 0.14 * Math.max(0, 1 - Math.abs(dd) / 0.5);
        } else if (kind === 3) {
          L += 0.05 * beat;
          if (h3(x, y, tk) < 0.03 * settled) { ch = c_star; L = 0.97; }
        }
        if (kind !== 5 && kind !== 7 && h3(x, y, tk2) < 0.006 * settled) { ch = c_star; L = 0.96; al = 1; }
        L += 0.2 * landF + 0.16 * sflash;
        if (sRing < RD * 1.1 && Math.abs(d - sRing) < 6) L += 0.22 * (1 - Math.abs(d - sRing) / 6);
        if (igniteK > 0) L += 0.3 * igniteK * Math.exp(-(spread - d) / 18);
      }
      if (tau < 1.2) {
        if (spread - d < 4) { ch = c_hash; L = 0.97; al = 1; kind = 8; }
        else if (tau < 1) {
          const tw = 1.6 + tol * RD * 0.6;
          if ((r1 > 0 && r1 < RD * 0.99 && Math.abs(d - r1) < tw) || (r2 > 0 && r2 < RD * 0.99 && Math.abs(d - r2) < tw) ||
              (r3 > 0 && r3 < RD * 0.99 && Math.abs(d - r3) < tw)) {

      /* the bright lines throw a thin curtain of light upward */
      if ((kind === 3 || kind === 1) && settled > 0) {
        const fl = 0.55 + 0.45 * h3(x, 3, tk2 + y);
        put(x, y - 1, c_colon, hsl(218, 0.2, 0.94, 0.42 * settled * fl), -501);
        put(x, y - 2, c_dot, hsl(218, 0.2, 0.94, 0.3 * settled * fl), -501);

      }
    }
  }
  /* the procession of small hearts on the outer band; they stand upright so they stay readable */
  const RB = RD * 0.871;
  for (let k = 0; k < NCHARM; k++) {
    const a = (k + 0.5) / NCHARM * TAU - rot * 0.5;
    const hx = RB * Math.sin(a), hz = RB * Math.cos(a);
    if (Math.abs(hx) > 68 || RB > spread) continue;
    const cx = cxc + hx, cy = floorRow + hz * ftilt;
    const s = 3.7 + 0.6 * Math.cos(a);
    const lit = Math.max(0, Math.sin(tReal * 2.4 - k * TAU / NCHARM * 3));
    const Lh = (0.86 + 0.08 * Math.cos(a)) + 0.12 * lit * settled + 0.2 * landF + 0.14 * sflash;
    const ya = Math.floor(cy - 2.6), yb = Math.ceil(cy + 2.6), xa = Math.floor(cx - s - 1), xb = Math.ceil(cx + s + 1);
    for (let yy = ya; yy <= yb; yy++) {
      const vy = -(yy - cy) / AR * 16 / s - 2.5;
      for (let xx = xa; xx <= xb; xx++) {
        const k2 = heartK((xx - cx) * 16 / s, vy);
        if (k2 > 1.04) continue;
        if (k2 > 0.5) put(xx, yy, c_at, hsl(218, 0.14, Math.min(0.98, Lh)), -499);
        else put(xx, yy, c_star, hsl(345, 0.45, Math.min(0.975, Lh - 0.06)), -499);
      }
    }
  }
  addHalo(cxc, floorRow + 2, 30, (0.1 + 0.07 * beat) * settled, hsl(218, 0.25, 0.94));
  if (landF > 0.05) addHalo(cxc, floorRow, 22, 0.5 * landF, hsl(216, 0.3, 0.92));
}

function drawBurst() {
  const tau = T - 0.39;
  if (tau < 0 || tau > 1) return;
  if (tau < 0.5) addHalo(cxc, floorRow, 13, 0.75 * (1 - tau / 0.5), hsl(44, 0.6, 0.9));
  for (let i = 0; i < NBURST; i++) {
    const life = buL[i];
    if (tau >= life) continue;
    const g = 2 * buVy[i] / life;
    const hgt = buVy[i] * tau - 0.5 * g * tau * tau;
    const r = buVr[i] * tau;
    const x = cxc + r * Math.sin(buA[i]), z = r * Math.cos(buA[i]);
    const y = floorRow + z * ftilt - hgt * AR;
    const p = tau / life;
    put(x, y, p < 0.4 ? c_star : p < 0.75 ? c_plus : c_dot, hsl(44, 0.75, 0.92 - 0.22 * p, 1 - 0.5 * p * p), z + 2);
  }
}

/* little <3 marks lift off the circle and drift upward */
function drawMotes() {
  if (T < 1.4) return;
  const fade = smooth((T - 1.4) / 0.6);
  for (let i = 0; i < NMOTE; i++) {
    const cyc = tReal * (0.1 + 0.05 * moP[i]) + moP[i] * 7;
    const n = Math.floor(cyc), p = cyc - n;
    const a = h2(i, n) * TAU, R = 34 + 50 * h2(i + 40, n);
    const zf = R * Math.cos(a);
    const x = Math.round(cxc + R * Math.sin(a) + Math.sin(tReal * 0.8 + i) * 1.2);
    const y = Math.round(floorRow + zf * ftilt - 1 - p * 11);
    const col = hsl(345, 0.35, 0.94, Math.sin(Math.PI * p) * 0.9 * fade);
    const z = zf > 0 ? 70 : -400;
    put(x - 1, y, c_lt, col, z); put(x, y, c_3, col, z);
  }
}

const TRUNK_GL = [c_hash, c_8, c_pct, c_at];
function drawTrunk() {
  if (T < 1.05) return;
  const topRow = Math.round(baseRow - 0.07 * treeH), botRow = Math.round(floorRow);
  const n = botRow - topRow + 1;
  const p = clamp01((T - 1.05) / 0.45);
  const vis = Math.min(n, Math.floor(p * n + 1e-6));
  const cx = Math.round(cxc);
  for (let i = 0; i < vis; i++) {
    const y = botRow - i;
    const halfW = 3.5 + 0.8 * (1 - i / n) + (i < 3 ? (3 - i) * 0.3 : 0);
    const hw = Math.ceil(halfW);
    for (let dx = -hw; dx <= hw; dx++) {
      if (Math.abs(dx) > halfW) continue;
      const u = dx / halfW;
      const sh = Math.max(0, 1 - Math.pow((u + 0.3) / 0.95, 2));
      let L = (0.1 + 0.2 * sh) * (0.78 + 0.44 * h2(cx + dx + 9, y * 3 + 1));
      if (p < 1 && i >= vis - 2) L += 0.07;
      const gk = i < 7 && T > 1.2 ? 1 - i / 7 : 0;
      put(cx + dx, y, TRUNK_GL[Math.floor(h2(cx + dx, y) * 4)], hsl(24 - 4 * gk, 0.4 - 0.16 * gk, L + 0.12 * gk), 3 * (1 - u * u) + 0.5);
    }
  }
}

/* ============================== drawing: tree, baubles, lights ============================== */
/* every cell shows the average of the points on its front surface, so the shading is smooth instead of noisy.
   colour is built in layers: a green ramp that runs from teal shadow to warm highlight, a cool rim light on the
   shadow side, frost, coloured light spilling from the nearby bulbs, the star's warm light at the top,
   and a rose glow from the magic circle on the lowest branches */
function drawTree(rot) {
  if (T <= 1.8) return;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const gc = gcols, rw = rows, tH = treeH, bR = baseRow, cx = cxc + 0.5, tl = tilt, q4 = quality, Tn = treeT, Tl = T;
  const dep = depA, cha = chA, cola = colA, dim = dimA;
  const y0 = Math.max(0, Math.floor(tipRow - 3)), y1 = Math.min(rw - 1, Math.ceil(baseRow + 16));
  const x0 = Math.max(0, Math.floor(cxc - 54)), x1 = Math.min(gc - 1, Math.ceil(cxc + 54));
  if (y1 < y0 || x1 < x0) return;
  for (let y = y0; y <= y1; y++) {
    tZ.fill(-1e9, y * gc + x0, y * gc + x1 + 1);
    tWs.fill(0, y * gc + x0, y * gc + x1 + 1);
  }
  /* when the star opens, a band of its light washes down the tree */
  const washOn = Tl > 5.86 && Tl < 6.3, fw = 1.06 - (Tl - 5.88) / 0.34 * 1.2;
  const starK = clamp01((Tl - 5.8) / 0.4) * (0.85 + 0.15 * Math.sin(tReal * 1.3));
  for (let k = 0; k < 6; k++) shK[k] = smooth((Tn - tShadowT[k]) / 0.55);
  let nProc = 0;
  for (let i = 0; i < NB; i++) {
    const age = Tn - pT[i];
    if (age < 0) break;
    nProc = i + 1;
    qIdx[i] = -1;
    if ((i & 3) >= q4) continue;
    let ext = 1;
    if (age < 0.12) { const e = 1 - age / 0.12; ext = 1 - 0.3 * e * e; }
    const r = pR[i] * ext;
    const sp = pSin[i] * cr + pCos[i] * sr, cp = pCos[i] * cr - pSin[i] * sr;
    /* the far half of the tree is always hidden behind the near half */
    if (cp < -0.12) continue;
    const z = r * cp;
    const x = Math.floor(cx + r * sp);
    if (x < x0 || x > x1) continue;
    const y = Math.floor(bR - (pF[i] - pDr[i] * ext * ext) * tH + z * tl + 0.5);
    if (y < y0 || y > y1) continue;
    const idx = y * gc + x;
    if (z < dep[idx]) continue;
    qIdx[i] = idx; qZ[i] = z; qSp[i] = sp; qCp[i] = cp; qExt[i] = age;
    if (z > tZ[idx]) tZ[idx] = z;
  }
  /* second pass: only the points on the front surface are shaded */
  for (let i = 0; i < nProc; i++) {
    const idx = qIdx[i];
    if (idx < 0) continue;
    const z = qZ[i];
    if (z < tZ[idx] - 2.2) continue;
    const sp = qSp[i], cp = qCp[i], age = qExt[i];
    const w = 0.5 - 0.5 * sp;
    const light = 0.03 + 0.97 * w * Math.sqrt(w) + 0.04 * cp;
    let b = pB[i] * 0.003921569;
    if (pSh[i] !== 255) b *= 1 - (1 - pSh[i] * 0.003921569) * shK[pK[i]];
    let bb = b * (0.16 + 0.92 * light);
    let fr = 0;
    /* snow lies on a patch when its own level passes a threshold that drops toward the lit side */
    if (pFr[i] !== 0 && w > 0.46) { const fd = (w - 0.46) * 1.5; if (pFr[i] * 0.003921569 > 1 - (fd > 0.66 ? 0.66 : fd)) fr = 1; }
    let young = 0, mat = 1;
    if (age < 1.7) {
      /* frost settles on a patch well after its leaves are out, each patch at its own moment */
      if (fr !== 0 && age < 0.45 + 0.9 * (1 - pFr[i] * 0.003921569)) fr = 0;
      if (age < 0.6) {
        /* fresh leaves are plain rows of '#', bright on the lit side and dark on the other; a moment later they
           break up and take their own texture and shade */
        mat = age <= 0.26 ? 0 : (age - 0.26) / 0.34; mat = mat * mat * (3 - 2 * mat);
        const yb = 0.09 + 0.44 * w * w + 0.05 * b;

    }
    if (washOn) {
      const dw = Math.abs(pF[i] - fw);
      if (dw < 0.1) { const k = 1 - dw / 0.1; bb += 0.4 * k; if (fr < 0.5 * k) fr = 0.5 * k; }
    }
    const dm = dim[idx];
    bb *= dm; fr *= dm;
    if (bb > 1) bb = 1;
    const li = pHv[i] * 64 + ((bb * 63) | 0);
    let r0 = gR[li], g0 = gG[li], b0 = gBl[li];
    /* cool rim light on the shadow side */
    if (sp > 0.4) {
      const k = (sp - 0.4) * (1 - 0.75 * cp) * b * 0.28 * dm * mat;
      r0 += 26 * k; g0 += 58 * k; b0 += 128 * k;
    }
    /* light spilling from the nearby bulbs */
    const ts = pTintS[i];
    if (ts !== 0 && Tl > pTintT[i]) {
      let k = (Tl - pTintT[i]) * 2;
      if (k > 1) k = 1;
      k *= ts * 0.003921569 * dm;
      const tc = pTintC[i];
      r0 += (((tc >> 16) & 255) - r0) * k; g0 += (((tc >> 8) & 255) - g0) * k; b0 += ((tc & 255) - b0) * k;
      if (bb < 0.6 * k) bb = 0.6 * k;
    }
    /* the star warms the top of the tree */
    if (starK > 0 && pF[i] > 0.76) {
      const k = (pF[i] - 0.76) * 1.7 * starK * dm * (0.4 + 0.6 * b);
      r0 += (255 - r0) * k; g0 += (240 - g0) * k; b0 += (206 - b0) * k;
    }
    const band = bb;
    if (tWs[idx] === 0) {
      tRs[idx] = r0; tGs[idx] = g0; tBs[idx] = b0; tBd[idx] = band; tYg[idx] = young; tFs[idx] = fr; tWs[idx] = 1;
    } else {
      tRs[idx] += r0; tGs[idx] += g0; tBs[idx] += b0; tBd[idx] += band; tYg[idx] += young; tFs[idx] += fr; tWs[idx] += 1;
    }
  }
  const glowRow = baseRow - 1, glowK = 0.07 + 0.02 * Math.sin(tReal * 3.7);
  for (let y = y0; y <= y1; y++) {
    /* the magic circle glows up onto the underside of the lowest branches */
    const ug = y > glowRow ? Math.min(1, (y - glowRow) / 7) * glowK : 0;
    for (let x = x0; x <= x1; x++) {
      const idx = y * gc + x, ws = tWs[idx];
      if (ws === 0) continue;
      const inv = 1 / ws;
      const snow = tFs[idx] * inv * dim[idx];
      const gn = h2(x, y);
      let gi = ((snow > 0.5 ? 0.72 + 0.3 * gn : tBd[idx] * inv + (gn - 0.5) * 0.36) * 4.999) | 0;
      if (gi < 0) gi = 0; else if (gi > 4) gi = 4;
      let rr = tRs[idx] * inv, gg = tGs[idx] * inv, bl = tBs[idx] * inv;
      /* no two neighbouring cells are quite the same green */
      const cn = 0.76 + 0.48 * h2(x * 5 + 11, y * 3 + 7);
      rr *= cn; gg *= cn; bl *= cn;
      if (snow > 0.5) {
        const sv = h2(x * 7 + 3, y * 5 + 1);
        if (sv < 0.26) { rr += (248 - rr) * 0.92; gg += (251 - gg) * 0.92; bl += (248 - bl) * 0.92; }
        else if (sv < 0.56) { const k = 0.55 + 0.5 * sv; rr += (156 - rr) * k; gg += (232 - gg) * k; bl += (200 - bl) * k; }
        else if (sv < 0.78) { const k = 0.2 + 0.7 * sv; rr += (204 - rr) * k; gg += (240 - gg) * k; bl += (172 - bl) * k; }
        else { rr = rr * 1.2 + 14; gg = gg * 1.2 + 30; bl = bl * 1.2 + 20; }
      }
      else if (snow > 0.2) { const k = (snow - 0.2) * 0.9; rr += (214 - rr) * k; gg += (240 - gg) * k; bl += (226 - bl) * k; }
      if (ug > 0) { const k = ug * dim[idx]; rr += (232 - rr) * k; gg += (238 - gg) * k; bl += (255 - bl) * k; }
      dep[idx] = tZ[idx];
      const yg = tYg[idx] * inv;
      /* between the '#' rows and the grown leaves there is one loose row where dots show through */
      cha[idx] = yg > 0.62 ? c_hash : yg > 0.12 && gn < 0.5 ? c_dot : snow > 0.5 && gn < 0.22 ? c_8 : TREE_GLYPHS[gi];
      const fa = 255;
      cola[idx] = ((fa << 24) | ((rr > 255 ? 255 : rr) << 16) | ((gg > 255 ? 255 : gg) << 8) | (bl > 255 ? 255 : bl)) >>> 0;
    }
  }

  const key = Math.floor(tReal * 7);
  for (let s = 0; s < 3; s++) {
    if (h2(key, s * 13 + 1) > 0.22) continue;
    const i = Math.floor(h2(key + 5, s + 2) * NB);
    if (T - pT[i] < 1.3) continue;
    const sp = pSin[i] * cr + pCos[i] * sr, cp = pCos[i] * cr - pSin[i] * sr;
    if (cp < 0.3) continue;
    const z = pR[i] * cp, x = Math.floor(cx + pR[i] * sp), y = Math.floor(bR - (pF[i] - pDr[i]) * tH + z * tl + 0.5);
    if (x < 0 || x >= gc || y < 0 || y >= rw) continue;
    const idx = y * gc + x;
    if (z >= dep[idx] - 1 && dim[idx] > 0.9) { cha[idx] = c_star; cola[idx] = WHITE; }
  }
}

function drawBaubles(rot) {
  if (T <= 1.8) return;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < baubles.length; i++) {
    const b = baubles[i];
    const age = treeT - b.t;
    if (age < 0) continue;
    const sp = b.s * cr + b.c * sr, cp = b.c * cr - b.s * sr;
    if (cp < -0.15) continue;
    const z = b.r * cp + 1.5;
    const drop = (easeOutBack(age / 0.5) - 1) * 5;
    const x = Math.round(cxc + b.r * sp), y = Math.round(baseRow - b.fy * treeH + z * tilt + 1 + drop);
    const w = 0.5 - 0.5 * sp;
    const ci = y >= 0 && y < rows && x >= 0 && x < gcols ? dimA[y * gcols + x] : 1;
    if (ci < 0.6) continue;
    const L = (0.2 + 0.34 * w) * ci;
    const c1 = hsl(354, 0.8, L + 0.06), c2 = hsl(354, 0.8, L);
    put(x - 1, y, c_at, c1, z); put(x, y, c_at, c1, z); put(x + 1, y, c_at, c2, z);
    put(x - 1, y + 1, c_at, c2, z); put(x, y + 1, c_O, hsl(354, 0.8, L + 0.12), z); put(x + 1, y + 1, c_at, hsl(354, 0.8, L * 0.8), z);
    if (ci > 0.9) put(x - 1, y, c_star, rgba(255, 244, 240), z + 0.1);
  }
}

const LIGHT_GL = [c_o, c_0, c_at, c_star, c_8, c_o, c_0, c_star];
function drawLights(rot) {
  if (T < 6.25) return;
  const tk = Math.floor(tReal * 1.6);
  for (let b = 0; b < NBULB; b++) {
    const age = T - bOn[b];
    if (age < 0) { bCol[b] = 0; continue; }
    const fl = Math.exp(-age * 7);
    const tw = 0.5 + 0.5 * Math.sin(tReal * bSpd[b] + bPh[b]);
    let L = 0.7 + 0.07 * tw;
    L += (0.95 - L) * fl;
    bCol[b] = hsl(bHue[b], 0.6, L);
    bCh[b] = fl > 0.45 ? c_at : bGl[b];
  }
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const gc = gcols, rw = rows, cx = cxc + 0.5;
  for (let i = 0; i < NL; i++) {
    const col = bCol[lB[i]];
    if (col === 0) continue;
    const sp = lSin[i] * cr + lCos[i] * sr, cp = lCos[i] * cr - lSin[i] * sr;
    const z = lR[i] * cp + 0.8;
    const x = Math.floor(cx + lR[i] * sp);
    if (x < 0 || x >= gc) continue;
    const y = Math.floor(baseRow - lFy[i] * treeH + z * tilt + 0.5);
    if (y < 0 || y >= rw) continue;
    const idx = y * gc + x;
    if (z < depA[idx] || dimA[idx] < 0.97) continue;
    depA[idx] = z; chA[idx] = bCh[lB[i]] === c_at ? c_at : LIGHT_GL[i & 7]; colA[idx] = col;
  }
}

/* ============================== drawing: ring, star, comets ============================== */
/* the growth ring: a fat, soft doughnut of light that rides on the growing top of the tree.
   Colour runs along the ring, not across it: twice round the colour wheel in one turn, so on the far half it
   goes green, butter, pink, violet from left to right and on the near half violet, pink, peach, green, teal.
   The rows of the tube differ mainly in depth of tone: it is shaded like a real tube lit from above, dim on its
   outer rows, white next to the hole on the far half and through the middle on the near half. Small ripples of
   hue break the near half into shorter runs, and the whole pattern drifts round the ring all the time.
   It opens wide around the foot of the tree and then draws in to the width of the growing top. */
/* the ring's trail. Every echo is a thin dotted outline that stays at the height where the ring left it, opens
   slowly outward and fades, so three or four of them hang below the rising ring, each wider and fainter than the
   one above. The tree and the ring hide their middles; what shows is their ends and the near arc at both sides.
   They are what joins one position of the ring to the next. */
const TRAIL_N = 12, TRAIL_LIFE = 0.9;
const trT = new Float32Array(TRAIL_N).fill(-99), trY = new Float32Array(TRAIL_N), trR = new Float32Array(TRAIL_N);
let trHead = 0, trLast = -99;
function drawRingTrail() {
  if (T < 1.5) { if (trLast > -99) { trT.fill(-99); trLast = -99; } return; }
  const rowsPerCol = 0.184 * AR;
  for (let k = 0; k < TRAIL_N; k++) {
    const age = tReal - trT[k];
    if (age < 0.04 || age >= TRAIL_LIFE) continue;
    const p = age / TRAIL_LIFE;
    const R = trR[k] + 1 + 11 * age, eb = R * rowsPerCol;
    const al = (p < 0.1 ? p / 0.1 : p < 0.5 ? 1 : 1 - (p - 0.5) / 0.5) * 0.62;
    const N = Math.ceil(TAU * R * 1.15);
    let lx = -999, ly = -999;
    for (let n = 0; n < N; n++) {
      const th = n / N * TAU;
      const x = Math.floor(cxc + R * Math.sin(th) + 0.5), y = Math.floor(trY[k] + eb * Math.cos(th) + 0.5);
      if (x === lx && y === ly) continue;
      lx = x; ly = y;
      /* runs of dots with short breaks, different for every echo */
      if (h2((x >> 2) + k * 17, y + k * 5) < 0.2) continue;
      put(x, y, c_dot, rgba(206, 212, 232, al), -300);
    }
  }

      const d = Math.hypot(tr.x - h.P[9].x, tr.y - h.P[9].y);
      if (d < bd) { bd = d; best = tr; }
    }
    if (!best) { best = newTrack(); tracks.push(best); } else { best.prevX = best.x; best.prevY = best.y; }
    best.matched = true; best.x = h.P[9].x; best.y = h.P[9].y; best.seen = now;
    h.tr = best;
  }
  for (let j = tracks.length - 1; j >= 0; j--) if (now - tracks[j].seen > 0.6) tracks.splice(j, 1);
}
function clearGestures() {
  for (let i = 0; i < tracks.length; i++) { const tr = tracks[i]; tr.fistT = -9; tr.path.length = 0; tr.snap.length = 0; }
  bothT = null; heartN = 0;
}
function handStill(o) {
  const tr = o.tr;
  return tr.prevX !== null && Math.hypot(tr.x - tr.prevX, tr.y - tr.prevY) < 0.4 * o.size;
}
function circleOK(path, size, needBoth) {
  const n = path.length;
  if (n < 8) return false;
  let cx = 0, cy = 0, nb = 0;
  for (let i = 0; i < n; i++) { cx += path[i].x; cy += path[i].y; if (path[i].both) nb++; }
  cx /= n; cy /= n;
  let sum = 0, rad = 0, pa = 0;
  for (let i = 0; i < n; i++) {
    const dx = path[i].x - cx, dy = path[i].y - cy;
    rad += Math.sqrt(dx * dx + dy * dy);
    const a = Math.atan2(dy, dx);
    if (i > 0) {
      let d = a - pa;
      if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
      sum += d;
    }
    pa = a;
  }
  rad /= n;
  if (rad < size / 3) return false;
  if (Math.abs(sum) < 270 * DEG) return false;
  if (needBoth && nb / n < 0.8) return false;
  return true;
}
function circleLockUpdate(up, now) {
  let p = null;
  for (let i = 0; i < up.length; i++) if (up[i].pointing) { p = up[i]; break; }
  if (!p) {
    if (now - lastPointT > 0.4) circleLock = false;
    lockBuf.length = 0;
    return;
  }
  lastPointT = now;
  if (!circleLock) return;
  lockBuf.push({ t: now, x: p.P[8].x, y: p.P[8].y });
  while (lockBuf.length && lockBuf[0].t < now - 0.4) lockBuf.shift();
  if (now - lockBuf[0].t >= 0.3) {
    let extent = 0;
    for (let i = 1; i < lockBuf.length; i++) extent = Math.max(extent, Math.hypot(lockBuf[i].x - lockBuf[0].x, lockBuf[i].y - lockBuf[0].y));
    if (extent < 0.3 * p.size) circleLock = false;
  }
}
function twistDetect(h, now) {
  const tr = h.tr, a = h.palmAng;
  if (tr.angRaw === null) { tr.angU = a; tr.angS = a; }
  else {
    let d = a - tr.angRaw;
    if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
    tr.angU += d;
    tr.angS = tr.angS * 0.5 + tr.angU * 0.5;
  }
  tr.angRaw = a;
  tr.ang.push({ t: now, a: tr.angS });
  while (tr.ang.length && tr.ang[0].t < now - 0.45) tr.ang.shift();
  if (now < twistCool) return;
  let ref = tr.angS;
  for (let i = 0; i < tr.ang.length; i++) ref = twistDir > 0 ? Math.min(ref, tr.ang[i].a) : Math.max(ref, tr.ang[i].a);
  if ((tr.angS - ref) * twistDir >= 40 * DEG) { doTwist(); twistCool = now + 1.0; tr.ang.length = 0; }
}

function onResults(res) {
  handOK = true;
  const now = performance.now() / 1000;
  const raw = (res && res.multiHandLandmarks) || [];
  handDraw = raw; handDrawT = now;
  const hs = [];
  for (let i = 0; i < raw.length; i++) if (raw[i] && raw[i].length >= 21) hs.push(analyse(raw[i]));
  assignTracks(hs, now);
  const vis = hs.filter(h => h.inside);

  /* snow: rubbing thumb against fingertips, at any time */
  for (let i = 0; i < vis.length; i++) {
    const h = vis[i], tr = h.tr;
    if (tr.tfPrev !== null && now > tr.tfT) {
      const rate = Math.abs(h.tf - tr.tfPrev) / (now - tr.tfT);
      tr.rub = tr.rub * 0.55 + Math.min(rate, 12) * 0.45;
    }
    tr.tfPrev = h.tf; tr.tfT = now;
    if (h.snow) { snowU = h.u; snowVv = h.v; snowRate = clamp((tr.rub - 0.5) * 40, 0, 240); snowSeen = now; }
  }

  /* twist: one upright hand, not counting a snow hand */
  const ns = vis.filter(h => !h.snow);
  if (ns.length === 1 && ns[0].upright && state === 'film' && T > 2.1) twistDetect(ns[0], now);
  else for (let i = 0; i < tracks.length; i++) { tracks[i].ang.length = 0; tracks[i].angRaw = null; }

  if (mode !== 'hands' || state !== 'film' || paused) return;
  const up = vis.filter(h => h.upright);
  circleLockUpdate(up, now);
  if (now < ignoreUntil) return;
  const next = stage + 1;
  if (next > 6) return;

  if (next === 1) {
    for (let i = 0; i < up.length; i++) {
      const h = up[i], tr = h.tr;
      if (h.fist) tr.fistT = now;
      else if (h.open && now - tr.fistT <= 1.0) { requestStage(1); return; }
    }
  } else if (next === 2 || next === 4) {
    for (let i = 0; i < up.length; i++) {
      const h = up[i], tr = h.tr;
      if (!h.pointing) {
        if (tr.path.length && now - tr.path[tr.path.length - 1].t > 0.4) tr.path.length = 0;
        continue;
      }
      if (circleLock) continue;
      let both = false;
      for (let j = 0; j < up.length; j++) {
        const o = up[j];
        if (o !== h && o.open && !o.pointing && d2(o.P[9], h.P[9]) > 1.2 * Math.max(o.size, h.size) && handStill(o)) both = true;
      }
      tr.path.push({ t: now, x: h.P[8].x, y: h.P[8].y, both: both });
      while (tr.path.length && tr.path[0].t < now - 1.8) tr.path.shift();
      if (circleOK(tr.path, h.size, next === 2)) { requestStage(next); return; }
    }
  } else if (next === 3) {
    if (!motionDone()) { for (let i = 0; i < tracks.length; i++) tracks[i].snap.length = 0; return; }
    for (let i = 0; i < vis.length; i++) {
      const h = vis[i], s = h.tr.snap;
      s.push({ len: h.midLen, prep: h.upright && h.midLen >= 1.3 && h.thumbOnMid, pt: h.pointing });
      if (s.length > 6) s.shift();
      const n = s.length, cur = s[n - 1];
      if (cur.prep || cur.pt) continue;
      for (let k = 1; k <= 2; k++) {
        const a = s[n - 1 - k], b = s[n - 2 - k];
        if (!a || !b || !a.prep || !b.prep) continue;
        let longest = 0;
        for (let j = n - 1 - k; j >= 0 && s[j].prep; j--) longest = Math.max(longest, s[j].len);
        if (longest - cur.len >= 0.45) { requestStage(3); return; }
      }
    }
  } else if (next === 5) {
    let ok = false;
    if (up.length >= 2) {
      const a = up[0], b = up[1];
      ok = a.open && b.open && d2(a.P[9], b.P[9]) >= 1.5 * (a.size + b.size) / 2;
    }
    if (ok) {
      if (bothT === null) bothT = now;
      bothMiss = now;
      if (now - bothT >= 0.3) requestStage(5);
    } else if (bothT !== null && now - bothMiss > 0.15) bothT = null;
  } else if (next === 6) {
    let ok = false;
    if (up.length >= 2) {
      const a = up[0], b = up[1], S = (a.size + b.size) / 2;
      ok = d2(a.P[4], b.P[4]) < 0.6 * S &&
        (d2(a.P[8], b.P[8]) < 0.6 * S || d2(a.P[12], b.P[12]) < 0.6 * S) &&
        d2(a.P[0], b.P[0]) > 1.1 * S &&
        a.nBent === 4 && b.nBent === 4 && (a.curlAvg + b.curlAvg) / 2 < 0.9;
    }
    heartN = ok ? heartN + 1 : 0;
    if (heartN >= 4) requestStage(6);
  }
}

/* the small camera window: the one thing besides the gradient that is painted */
function drawCamera() {
  if (!camReady || !video || video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const s = 0.26 * PW, m = 0.03 * PW, x = stageX + PW - s - m, y = m;
  const side = Math.min(vw, vh), sx = (vw - side) / 2, sy = (vh - side) / 2;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, s, s, s * 0.09);
  ctx.clip();
  ctx.translate(x + s, y);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, side, side, 0, 0, s, s);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (performance.now() / 1000 - handDrawT < 0.35) {
    ctx.lineWidth = Math.max(1, s * 0.007);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(235,233,221,0.55)';
    ctx.fillStyle = 'rgba(235,233,221,0.95)';
    for (let k = 0; k < handDraw.length; k++) {
      const lm = handDraw[k];
      if (!lm || lm.length < 21) continue;
      const qx = i => x + s - (lm[i].x * vw - sx) / side * s, qy = i => y + (lm[i].y * vh - sy) / side * s;
      ctx.beginPath();
      for (let b = 0; b < BONES.length; b++) { ctx.moveTo(qx(BONES[b][0]), qy(BONES[b][0])); ctx.lineTo(qx(BONES[b][1]), qy(BONES[b][1])); }
      ctx.stroke();
      for (let i = 0; i < 21; i++) {
        const r = s * (i % 4 === 0 && i > 0 ? 0.017 : 0.011);
        ctx.beginPath();
        ctx.roundRect(qx(i) - r, qy(i) - r, 2 * r, 2 * r, r);
        ctx.fill();
      }
    }
  }
  ctx.restore();
  ctx.beginPath();
  ctx.roundRect(x, y, s, s, s * 0.09);
  ctx.lineWidth = Math.max(1, PW * 0.0022);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.stroke();
}

/* ============================== sound ============================== */
let actx = null, bus = null, noiseBuf = null;
let lastStep = -1, lastGrain = -1;
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    actx = new AC();
    bus = actx.createGain();
    const dry = actx.createGain(); dry.gain.value = 0.85;
    const wet = actx.createGain(); wet.gain.value = 0.32;
    const conv = actx.createConvolver();
    const len = Math.floor(actx.sampleRate * 2.4);
    const ir = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    conv.buffer = ir;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4;
    const master = actx.createGain(); master.gain.value = 1.3;
    bus.connect(dry); dry.connect(comp);
    bus.connect(conv); conv.connect(wet); wet.connect(comp);
    comp.connect(master); master.connect(actx.destination);
    const nl = Math.floor(actx.sampleRate * 2);
    noiseBuf = actx.createBuffer(1, nl, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
  } catch (err) {
    actx = null;
  }
}
function audioOK() { return !!actx && actx.state === 'running'; }
function outNode(pan) {
  if (pan && actx.createStereoPanner) {
    const p = actx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(bus);
    return p;
  }
  return bus;
}
function envGain(t, vol, att, dur) {
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, att + 0.02));
  return g;
}
const PENT = [0, 2, 4, 7, 9];
function pent(i) {
  const o = Math.floor(i / 5);
  return 523.25 * Math.pow(2, (PENT[i - o * 5] + 12 * o) / 12);
}
const BELL_PARTS = [[1, 1, 1], [2.76, 0.2, 0.62], [5.4, 0.07, 0.4]];
function bell(t, f, vol, dur, pan) {
  const dst = outNode(pan);
  for (let i = 0; i < 3; i++) {
    const fq = f * BELL_PARTS[i][0];
    if (fq > 16000) continue;
    const o = actx.createOscillator();
    o.type = 'sine'; o.frequency.value = fq;
    const d = dur * BELL_PARTS[i][2];
    const g = envGain(t, vol * BELL_PARTS[i][1], 0.004, d);
    o.connect(g); g.connect(dst);
    o.start(t); o.stop(t + d + 0.05);
  }
}
function noise(t, dur, f0, f1, q, vol, att, pan) {
  const s = actx.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  const fl = actx.createBiquadFilter();
  fl.type = 'bandpass'; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = envGain(t, vol, att, dur);
  s.connect(fl); fl.connect(g); g.connect(outNode(pan));
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function glide(t, f0, f1, dur, vol, type, att) {
  const o = actx.createOscillator();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = envGain(t, vol, att || 0.008, dur + 0.04);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.1);
}
function pad(t, f, vol, att, dur) {
  const o = actx.createOscillator();
  o.type = 'sine'; o.frequency.value = f;
  const g = envGain(t, vol, att, dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.05);
}
/* a noise bed whose loudness flutters like leaves brushing each other; its pitch never sweeps upward */
function leafBed(t, dur, fLo, fHi, vol) {
  const s = actx.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  const fl = actx.createBiquadFilter();
  fl.type = 'bandpass'; fl.Q.value = 0.9;
  if (fHi > fLo) {
    const fc = new Float32Array(48);
    let w = 0.5;
    for (let i = 0; i < 48; i++) { w = clamp(w + (Math.random() - 0.5) * 0.5, 0, 1); fc[i] = lerp(fLo, fHi, w); }
    fl.frequency.setValueCurveAtTime(fc, t, dur);
  } else fl.frequency.value = fLo;
  const flut = actx.createGain();
  const N = 256, curve = new Float32Array(N);
  let v = 0.5;
  for (let i = 0; i < N; i++) {
    v = clamp(v + (Math.random() - 0.5) * 0.6, 0.08, 1);
    const spike = Math.random() < 0.08 ? 1.5 : 1;
    curve[i] = vol * Math.min(1.3, v * spike) * Math.pow(Math.sin(Math.PI * i / (N - 1)), 0.7);
  }
  curve[0] = 0; curve[N - 1] = 0;
  flut.gain.setValueCurveAtTime(curve, t, dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(1, t + 0.5);
  g.gain.setValueAtTime(1, t + dur - 0.8);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(flut); flut.connect(g); g.connect(bus);
  s.start(t); s.stop(t + dur + 0.05);
}

function sDrop(t) {
  glide(t, 2400, 620, 0.34, 0.1, 'sine');
  bell(t, pent(12), 0.08, 1.2, 0);
}
function sLand(t) {
  glide(t, 120, 44, 0.42, 0.55, 'sine');
  noise(t, 1.2, 280, 2600, 0.8, 0.13, 0.35, 0);
  bell(t, pent(-10), 0.2, 3.2, -0.3);
  bell(t + 0.04, pent(-7), 0.16, 3.2, 0.3);
  for (let i = 0; i < 3; i++) bell(t + 0.3 + 0.13 * i, pent(9 + i * 2), 0.07, 1.0, (i - 1) * 0.5);
}
function sTrunk(t) {
  for (let i = 0; i < 6; i++) {
    const tt = t + i * 0.07, k = Math.pow(1.13, i);
    glide(tt, 150 * k, 110 * k, 0.07, 0.22, 'triangle', 0.003);
    noise(tt, 0.03, 1700, 1700, 2.5, 0.08, 0.002, 0);
  }
}
function sRing(t) {
  noise(t, 0.62, 420, 4200, 1.4, 0.12, 0.4, 0);
  glide(t, 330, 990, 0.6, 0.07, 'sine', 0.2);
  bell(t + 0.6, pent(5), 0.14, 1.6, 0);
}
function sLeaves(t) {
  leafBed(t, 3.6, 2600, 3800, 0.05);
  leafBed(t, 3.6, 6200, 6200, 0.03);
}
function sStar(t) {
  for (let i = 0; i < 5; i++) bell(t + i * 0.055, pent(5 + i), 0.08, 0.5, 0);
  const notes = [5, 7, 8, 10], pans = [-0.7, 0.7, -0.35, 0.35];
  for (let i = 0; i < 4; i++) bell(t + 0.38, pent(notes[i]), 0.11, 2.4, pans[i]);
  noise(t + 0.38, 1.4, 8000, 9500, 1.2, 0.035, 0.25, 0);
}
function sComets(t) {
  noise(t, 0.9, 5200, 600, 1.2, 0.12, 0.15, 0);
  for (let i = 0; i < 24; i++) bell(t + i * 0.125, pent(13 - Math.floor(i / 2)), 0.065, 0.7, i % 2 ? 0.95 : -0.95);
}
function sLit(t) {
  const notes = [-5, -3, -2, 0];
  for (let i = 0; i < 4; i++) pad(t, pent(notes[i]), 0.07, 0.5, 3.0);
  bell(t, pent(5), 0.1, 2.0, 0);
}
const GIFT_NOTES = [5, 6, 7, 8, 10];
function sGift(t, i) {
  const f0 = 240 * Math.pow(1.26, i);
  glide(t, f0, f0 * 3.2, 0.075, 0.2, 'sine', 0.004);
  noise(t, 0.03, 3000, 3000, 2, 0.07, 0.002, 0);
  bell(t + 0.06, pent(GIFT_NOTES[i]), 0.12, 1.2, (i - 2) * 0.35);
}
const SLEIGH = [2793, 2840, 3136, 3185];
function sDeer(t) {
  for (let i = 0; i < 7; i++) bell(t + i * 0.07, pent(3 + i), 0.09, 0.9, -0.9 + i * 0.3);
  for (let j = 0; j < 8; j++) {
    const tt = t + 0.6 + j * 0.17, v = 1 - j / 9;
    noise(tt, 0.05, 6000, 6000, 3, 0.07 * v, 0.003, 0);
    for (let k = 0; k < 4; k++) bell(tt, SLEIGH[k], 0.022 * v, 0.22, j % 2 ? 0.4 : -0.4);
  }
}
const CUES = [
  [0.05, sDrop], [0.39, sLand], [1.05, sTrunk], [1.5, sRing], [2.1, sLeaves], [5.6, sStar], [6.25, sComets], [9.24, sLit],
  [9.35, t => sGift(t, 0)], [9.61, t => sGift(t, 1)], [9.87, t => sGift(t, 2)], [10.13, t => sGift(t, 3)],
  [10.39, t => sGift(t, 4)], [10.85, sDeer]
];
/* every cue fires once when T crosses its time; if the context is not running the cue is skipped */
function runCues() {
  if (T <= prevT) return;
  const ok = audioOK();
  const at = ok ? actx.currentTime + 0.01 : 0;
  for (let i = 0; i < CUES.length; i++) {
    const c = CUES[i][0];
    if (prevT <= c && T > c && ok) CUES[i][1](at);
  }
  if (T > 2.1 && T < 5.7) {
    const F = Math.min(1, growF(T));
    const st = Math.floor(F * 40), gr = Math.floor(F * 70);
    if (st > lastStep) {
      lastStep = st;
      if (ok && Math.random() < 0.75) bell(at, pent(8 + Math.floor(Math.random() * 8)), 0.035, 0.9, Math.random() * 2 - 1);
    }
    if (gr > lastGrain) {
      lastGrain = gr;
      if (ok) { const f = 3000 + Math.random() * 4000; noise(at, 0.05, f, f, 2, 0.02, 0.008, Math.random() - 0.5); }
    }
  }
}

/* ============================== input and start ============================== */
window.addEventListener('keydown', e => {
  const k = e.key;
  if (state === 'start') {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); begin(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'r' || k === 'R') resetFilm();
  else if (k.length === 1 && k >= '1' && k <= '6') requestStage(k.charCodeAt(0) - 48);
  else if (k === 'd' || k === 'D') twistDir = -twistDir;
  else if (k === 't' || k === 'T') doTwist();
});
cv.addEventListener('click', begin);
window.addEventListener('resize', resize);

genTree();
genMisc();
genGifts();
resize();
requestAnimationFrame(frame);
</script>
