<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Tree - Hands</title>
<style>
html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; }
canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; cursor: pointer; }
#out { display: none; inset: 0; margin: auto; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); }
body.split #c { visibility: hidden; }
body.split #out { display: block; }
.tool { position: fixed; top: 14px; width: 36px; height: 36px; padding: 0; border-radius: 50%; cursor: pointer; opacity: 0.4;
  border: 1.5px solid rgba(255, 255, 255, 0.6); background: rgba(8, 12, 26, 0.6); transition: opacity 0.2s; }
.tool:hover { opacity: 1; }
#bSplit { left: 14px; }
#bRec { left: 60px; }
#bSplit::before, #bSplit::after { content: ''; position: absolute; left: 10px; width: 14px; border: 1.5px solid #fff; border-radius: 2px; }
#bSplit::before { top: 8px; height: 4px; }
#bSplit::after { top: 17px; height: 8px; }
#bRec::before { content: ''; position: absolute; left: 9px; top: 9px; width: 15px; height: 15px; border-radius: 50%; background: #ff4a4a; }
body.rec #bRec { opacity: 1; border-color: #ff4a4a; }
body.rec #bRec::before { border-radius: 2px; left: 11px; top: 11px; width: 11px; height: 11px; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="out"></canvas>
<button id="bSplit" class="tool" title="上下分割畫面：上方鏡頭，下方聖誕樹（鍵盤 L）"></button>
<button id="bRec" class="tool" title="開始 / 停止錄影（鍵盤 V）"></button>
<script>
'use strict';

/* ============================== helpers ============================== */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const COLS = 124;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const smooth = t => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOutCubic = t => { t = clamp01(t); return 1 - Math.pow(1 - t, 3); };
const easeOutBack = t => {
  t = clamp01(t);
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};
const easeInOut15 = g => (g < 0.5 ? Math.pow(2 * g, 1.5) / 2 : 1 - Math.pow(2 * (1 - g), 1.5) / 2);
const easeInOut15Inv = e => (e < 0.5 ? Math.pow(2 * e, 1 / 1.5) / 2 : 1 - Math.pow(2 * (1 - e), 1 / 1.5) / 2);
/* the growth front: it leaves the ground gently and then rises at a steady pace; the tip is reached at about 5 s */
const growF = t => Math.pow(clamp01((t - 2.18) / 3.05), 1.2) * 1.06;
const tPassOf = f => 2.18 + 3.05 * Math.pow(clamp01(f / 1.06), 1 / 1.2);

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function h2(x, y) {
  let n = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function h3(x, y, z) { return h2((x | 0) + Math.imul(z | 0, 7919), (y | 0) + Math.imul(z | 0, 104729)); }

/* colours are packed as 0xAARRGGBB */
function hsl(h, s, l, a) {
  h = ((h % 360) + 360) % 360;
  s = clamp01(s); l = clamp01(l);
  const c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)), m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (hp < 1) { r = c; g = x; } else if (hp < 2) { r = x; g = c; } else if (hp < 3) { g = c; b = x; }
  else if (hp < 4) { g = x; b = c; } else if (hp < 5) { r = x; b = c; } else { r = c; b = x; }
  const A = a === undefined ? 255 : (clamp01(a) * 255 + 0.5) | 0;
  return ((A << 24) | ((((r + m) * 255 + 0.5) | 0) << 16) | ((((g + m) * 255 + 0.5) | 0) << 8) | (((b + m) * 255 + 0.5) | 0)) >>> 0;
}
function rgba(r, g, b, a) {
  const A = a === undefined ? 255 : (clamp01(a) * 255 + 0.5) | 0;
  return ((A << 24) | (r << 16) | (g << 8) | b) >>> 0;
}
const HUE_STOPS = [318, 282, 228, 190, 150, 56, 38, 56, 150, 190, 228, 282, 318];
function rampHue(p) {
  p = fract(p) * 12;
  const i = Math.min(11, Math.floor(p));
  return lerp(HUE_STOPS[i], HUE_STOPS[i + 1], p - i);
}
/* light colour: yellows and golds are pulled toward amber so they do not glare */
function lightCol(h, l, a) {
  let s = 1;
  if (h < 100) { const k = smooth((100 - h) / 45); s = 1 - 0.34 * k; l -= 0.05 * k; }
  return hsl(h, s, l, a);
}

const c_hash = 35, c_at = 64, c_pct = 37, c_amp = 38, c_8 = 56, c_plus = 43, c_star = 42, c_dot = 46;
const c_colon = 58, c_eq = 61, c_minus = 45, c_pipe = 124, c_slash = 47, c_bslash = 92, c_o = 111;
const c_0 = 48, c_O = 79, c_x = 120, c_apos = 39, c_under = 95, c_lt = 60, c_3 = 51;
const CHS = [];
for (let i = 0; i < 128; i++) CHS.push(String.fromCharCode(i));
const TREE_GLYPHS = [c_8, c_amp, c_pct, c_hash, c_at];
const WHITE = rgba(252, 252, 255);

/* ============================== canvas and grid ============================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lay = document.createElement('canvas'), lctx = lay.getContext('2d');
const bgc = document.createElement('canvas'), bgx = bgc.getContext('2d');
const bl1 = document.createElement('canvas'), bl1x = bl1.getContext('2d');
const bl2 = document.createElement('canvas'), bl2x = bl2.getContext('2d');
const bl3 = document.createElement('canvas'), bl3x = bl3.getContext('2d');
const tintC = document.createElement('canvas'), tintX = tintC.getContext('2d');
/* the split view, which is also what gets recorded: the camera across the top, the scene underneath */
const outC = document.getElementById('out'), outX = outC.getContext('2d');
/* a 1080 x 1920 picture. The scene is drawn with its stage at three quarters of the full width, so the whole
   tree, the gifts and the floor fit under the camera picture with some sky above the star for the snow */
const OUT_W = 1080, OUT_H = 1920, CAM_H = 608, SCENE_H = 1440, SCENE_Y0 = (1440 - (1920 - 608)) / 1440;
outC.width = OUT_W; outC.height = OUT_H;
let splitView = false;
let tintImg = null, tintPx = new Uint32Array(1), glowImg = null, glowPx = new Uint32Array(1);

let dpr = 1, W = 2, H = 2, PW = 2, CW = 1, CH = 1.62, AR = 1 / 1.62, rows = 1, gcols = COLS, extra = 0;
let gridX0 = 0, stageX = 0, cxc = 61.5;
let chA = new Uint8Array(1), colA = new Uint32Array(1), depA = new Float32Array(1), dimA = new Float32Array(1);
let tZ = new Float32Array(1), tRs = new Float32Array(1), tGs = new Float32Array(1), tBs = new Float32Array(1);
let tWs = new Float32Array(1), tBd = new Float32Array(1), tYg = new Float32Array(1), tFs = new Float32Array(1), tAg = new Float32Array(1);
let crossX = new Float32Array(8), crossN = new Uint8Array(1);
let floorRow = 0, baseRow = 0, tipRow = 0, treeH = 1, tilt = 0.1, ftilt = 0.17;
const TR = 0.32 * COLS;
const FFLOOR = -(0.845 - 0.724) / (0.724 - 0.273);

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(2, Math.floor(window.innerWidth * dpr));
  H = Math.max(2, Math.floor(window.innerHeight * dpr));
  if (splitView) { dpr = 1; W = OUT_W; H = SCENE_H; }
  cv.width = W; cv.height = H;
  PW = Math.min(W, H * 9 / 16);
  CW = PW / COLS; CH = CW * 1.62; AR = CW / CH;
  rows = Math.max(1, Math.floor(H / CH));
  stageX = (W - PW) / 2;
  extra = Math.max(0, Math.ceil(stageX / CW - 1e-6));
  gcols = COLS + 2 * extra;
  gridX0 = stageX - extra * CW;
  cxc = extra + 61.5;
  const n = gcols * rows;
  chA = new Uint8Array(n); colA = new Uint32Array(n); depA = new Float32Array(n); dimA = new Float32Array(n);
  tZ = new Float32Array(n); tRs = new Float32Array(n); tGs = new Float32Array(n); tBs = new Float32Array(n);
  tWs = new Float32Array(n); tBd = new Float32Array(n); tYg = new Float32Array(n); tFs = new Float32Array(n); tAg = new Float32Array(n);
  crossX = new Float32Array(rows * 8); crossN = new Uint8Array(rows);
  floorRow = 0.845 * rows; baseRow = 0.724 * rows; tipRow = 0.273 * rows; treeH = baseRow - tipRow;
  tilt = 0.17 * AR; ftilt = 0.28 * AR;
  lay.width = W; lay.height = H;
  tintC.width = gcols; tintC.height = rows;
  tintImg = tintX.createImageData(gcols, rows);
  tintPx = new Uint32Array(tintImg.data.buffer);
  bgc.width = W; bgc.height = H;
  bl1.width = gcols; bl1.height = rows;
  bl2.width = Math.max(1, gcols >> 1); bl2.height = Math.max(1, rows >> 1);
  bl3.width = Math.max(1, gcols >> 2); bl3.height = Math.max(1, rows >> 2);
  glowImg = bl1x.createImageData(gcols, rows);
  glowPx = new Uint32Array(glowImg.data.buffer);
  const gr = bgx.createLinearGradient(0, 0, 0, H);
  /* night: almost black overhead, a deep blue toward the ground */
  gr.addColorStop(0, '#03050f'); gr.addColorStop(0.5, '#070d22');
  gr.addColorStop(0.86, '#0d1735'); gr.addColorStop(1, '#152447');
  bgx.fillStyle = gr; bgx.fillRect(0, 0, W, H);
  lctx.font = 'bold ' + (0.95 * CH).toFixed(2) + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
}

function put(x, y, ch, col, z) {
  x = Math.floor(x + 0.5); y = Math.floor(y + 0.5);
  if (x < 0 || x >= gcols || y < 0 || y >= rows) return;
  const i = y * gcols + x;
  if (z >= depA[i]) { depA[i] = z; chA[i] = ch; colA[i] = col; }
}

/* halos: characters sprinkled into empty cells around bright sources */
const HMAX = 16;
const haX = new Float32Array(HMAX), haY = new Float32Array(HMAX), haR = new Float32Array(HMAX), haS = new Float32Array(HMAX);
const haC = new Uint32Array(HMAX);
let nHalo = 0;
function addHalo(x, y, r, s, col) {
  if (nHalo >= HMAX || s <= 0.01) return;
  haX[nHalo] = x; haY[nHalo] = y; haR[nHalo] = r; haS[nHalo] = s; haC[nHalo] = col; nHalo++;
}
function drawHalos() {
  const tk = Math.floor(tReal * 9);
  for (let k = 0; k < nHalo; k++) {
    const R = haR[k], hx = haX[k], hy = haY[k], st = haS[k], col = haC[k];
    const y0 = Math.max(0, Math.floor(hy - R * AR)), y1 = Math.min(rows - 1, Math.ceil(hy + R * AR));
    const x0 = Math.max(0, Math.floor(hx - R)), x1 = Math.min(gcols - 1, Math.ceil(hx + R));
    for (let y = y0; y <= y1; y++) {
      const dy = (y - hy) / AR;
      for (let x = x0; x <= x1; x++) {
        const i = y * gcols + x;
        if (chA[i] !== 0) continue;
        const dx = x - hx, d = Math.sqrt(dx * dx + dy * dy);
        if (d > R) continue;
        const q = 1 - d / R;
        if (h3(x, y, tk + k * 31) < st * q * q) {
          chA[i] = d < R * 0.33 ? c_plus : d < R * 0.66 ? c_colon : c_dot;
          colA[i] = (col & 0xffffff) | ((((0.35 + 0.65 * q) * 255) | 0) << 24);
        }
      }
    }
  }
}

/* ============================== clocks and state ============================== */
let state = 'start';
let mode = 'idle';
let paused = false;
let tReal = 0, T = 0, prevT = 0, Tlimit = 0, stage = 0, treeT = 0;
let lastMs = 0;
let pending = null;
let ignoreUntil = 0;
let quality = 4, emaDt = 5, slowT = 0;
const STAGE_END = [0, 1.5, 5.6, 6.25, 9.25, 10.8, Infinity];
const twists = [];
let twistDir = 1, twistCool = 0;

function motionDone() { return T >= Tlimit - 1e-4; }
function twistExtra() {
  let e = 0;
  for (let i = 0; i < twists.length; i++) e += twists[i].d * (Math.PI / 3) * easeOutCubic((tReal - twists[i].t) / 1.5);
  return e;
}
function doTwist() {
  if (state !== 'film' || T <= 2.1) return;
  twists.push({ t: tReal, d: twistDir });
  if (twists.length > 12) twists.shift();
}

/* ============================== static scene data ============================== */
const tR = [1.15, 0.92, 0.74, 0.57, 0.39, 0.22];
const tFb = [0, 0.205, 0.385, 0.545, 0.685, 0.81];
const tFt = [0.265, 0.445, 0.605, 0.745, 0.87, 1.0];
const tLobes = [13, 11, 10, 8, 7, 6];
const tDepth = [0.15, 0.16, 0.17, 0.19, 0.21, 0.25];
const tDroop = [0.072, 0.046, 0.038, 0.03, 0.024, 0.015];
const LB = [], LLEN = [], LBR = [], LDR = [];
function prof(k, u) { return k < 5 ? 1 - 0.5 * Math.pow(u, 0.9) : Math.pow(Math.max(0, 1 - u), 0.8); }

let lobeI = 0, lobeShape = 0;
function lobeAt(k, a) {
  const b = LB[k], n = tLobes[k];
  a = a - Math.floor(a / TAU) * TAU;
  if (a < b[0]) a += TAU;
  let i = Math.min(n - 1, Math.max(0, Math.floor((a - b[0]) / TAU * n)));
  while (i > 0 && a < b[i]) i--;
  while (i < n - 1 && a >= b[i + 1]) i++;
  lobeI = i;
  const s = clamp01((a - b[i]) / (b[i + 1] - b[i]));
  lobeShape = Math.pow(Math.max(0, Math.sin(Math.PI * s)), 0.55);
}
function edgeF(k) { return LLEN[k][lobeI] * (1 - tDepth[k] * (1 - lobeShape)); }

const WT = new Float32Array(257), WR = new Float32Array(257);
/* the unsmoothed outline: it steps out again wherever a new tier begins */
function treeWR(f) {
  if (f <= 0) return WR[0];
  if (f >= 1) return 0;
  const p = f * 256, i = Math.floor(p);
  return lerp(WR[i], WR[i + 1], p - i);
}
function treeW(f) {
  if (f <= 0) return WT[0];
  if (f >= 1) return WT[256];
  const p = f * 256, i = Math.floor(p);
  return lerp(WT[i], WT[i + 1], p - i);
}

const NB = 100000, NL = 5000;
let pR, pSin, pCos, pF, pDr, pT, pB, pFr, pHv, pGj, pTintC, pTintT, pTintS;
const qIdx = new Int32Array(NB), qZ = new Float32Array(NB), qSp = new Float32Array(NB), qCp = new Float32Array(NB), qExt = new Float32Array(NB);
const lR = new Float32Array(NL), lSin = new Float32Array(NL), lCos = new Float32Array(NL), lFy = new Float32Array(NL);
const lB = new Uint16Array(NL);
let NBULB = 0;
let bOn, bHue, bPh, bSpd, bGl, bCol, bCh, bAng, bRad, bFy, bTier, bGold, bSh;
const baubles = [];
const COMET_A0 = 0.9;
const gR = new Uint8Array(8 * 64), gG = new Uint8Array(8 * 64), gBl = new Uint8Array(8 * 64);

function genTree() {
  const rng = mulberry(20251225);
  for (let k = 0; k < 6; k++) {
    const n = tLobes[k];
    const b = new Float32Array(n + 1), ln = new Float32Array(n), br = new Float32Array(n), dr = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      b[i] = (i + (rng() - 0.5) * 0.5) / n * TAU;
      ln[i] = 0.93 + 0.07 * rng();
      br[i] = 1.08 - (0.34 + 0.05 * k) * rng();
      dr[i] = 0.65 + 0.7 * rng();
    }
    b[n] = b[0] + TAU;
    LB.push(b); LLEN.push(ln); LBR.push(br); LDR.push(dr);
  }
  /* width envelope, smoothed so the ring and the comets move without jumps */
  const raw = new Float32Array(257);
  for (let i = 0; i <= 256; i++) {
    const f = i / 256;
    let w = 0;
    for (let k = 0; k < 6; k++) {
      if (f >= tFb[k] && f <= tFt[k]) w = Math.max(w, tR[k] * TR * prof(k, (f - tFb[k]) / (tFt[k] - tFb[k])));
    }
    raw[i] = w;
  }
  WR.set(raw);
  for (let i = 0; i <= 256; i++) {
    let s = 0, c = 0;
    for (let j = -9; j <= 9; j++) { const q = i + j; if (q >= 0 && q <= 256) { s += raw[q]; c++; } }
    WT[i] = s / c;
  }
  WT[256] = 0;

  /* green lookup: 8 hue variants x 64 brightness levels */
  for (let hv = 0; hv < 8; hv++) {
    for (let lv = 0; lv < 64; lv++) {
      const t = lv / 63;
      const c = hsl(174 - 44 * t + (hv - 3.5) * 2.4, 0.42 + 0.26 * t, 0.045 + 0.54 * t);
      gR[hv * 64 + lv] = (c >> 16) & 255; gG[hv * 64 + lv] = (c >> 8) & 255; gBl[hv * 64 + lv] = c & 255;
    }
  }

  /* bulbs: a rainbow string on each rim, a gold string just inside it */
  const B = [];
  const rainbowStart = [], rainbowCount = [];
  const SWAG = [7, 6, 5, 4, 3, 3], GC = [3, 3, 2, 2, 2, 1];
  const hf = 1 - FFLOOR;
  function onTime(f, a) {
    const sl = (1 - f) / hf;
    let best = 9;
    for (let c = 0; c < 2; c++) {
      let d = a - COMET_A0 - c * Math.PI;
      d = d - Math.floor(d / TAU) * TAU;
      const base = d / (8 * Math.PI);
      const s = base + 0.25 * Math.max(0, Math.ceil((sl - base) / 0.25));
      if (s < best) best = s;
    }
    return 6.25 + 3 * Math.min(best, 0.84);
  }
  for (let k = 0; k < 6; k++) {
    const nb = Math.max(8, Math.round(TAU * tR[k] * TR / 2.1));
    rainbowStart.push(B.length); rainbowCount.push(nb);
    for (let j = 0; j < nb; j++) {
      const a = (j + 0.5) / nb * TAU;
      lobeAt(k, a);
      const dr = tDroop[k] * LDR[k][lobeI] * (0.5 + 0.5 * lobeShape);
      const keep = h2(k + 3, Math.floor(j / 6) + 40) >= 0.04;
      /* the string hangs in swags between the branch tips. Its colour stays in the orange family: it swings
         slowly between red and yellow through orange, and separately between deep and light tones */
      const drape = Math.sin(Math.PI * fract(a / TAU * SWAG[k] + k * 0.37));
      const fy = tFb[k] - dr * 0.5 + 0.006 - 0.03 * drape + 0.008 * Math.sin(a * 2 + k * 1.3);
      const hue = (29 + 27 * Math.sin(a * GC[k] + k * 1.1) + 5 * (h2(k * 31 + 5, j * 3 + 1) - 0.5) + 360) % 360;
      const sh = Math.sin(a * (GC[k] + 2) + k * 2.3);
      B.push({ k: k, a: a, r: tR[k] * TR * edgeF(k) + 0.3, fy: fy, keep: keep, gold: 0,
        hue: hue, sh: sh, on: onTime(fy, a), sp: TAU / nb });
    }
    const ng = Math.max(5, Math.round(nb * 0.6));
    for (let j = 0; j < ng; j++) {
      const a = (j + 0.5) / ng * TAU + 0.013;
      lobeAt(k, a);
      const dr = tDroop[k] * LDR[k][lobeI] * (0.5 + 0.5 * lobeShape);
      const keep = h2(k + 11, Math.floor(j / 4) + 90) >= 0.18;
      /* the second strand crosses the first: its swags fall where the first one is pinned up */
      const drape = Math.sin(Math.PI * fract(a / TAU * SWAG[k] + k * 0.37 + 0.5));
      const fy = tFb[k] - dr * 0.5 + 0.012 - 0.024 * drape;
      const hue = (29 + 27 * Math.sin(a * GC[k] + k * 1.1 + 1.2) + 360) % 360;
      const sh = Math.sin(a * (GC[k] + 2) + k * 2.3 + 2);
      B.push({ k: k, a: a, r: tR[k] * TR * edgeF(k) * 0.95, fy: fy, keep: keep, gold: 1,
        hue: hue, sh: sh, on: onTime(fy, a), sp: TAU / ng });
    }
  }
  NBULB = B.length;
  bOn = new Float32Array(NBULB); bHue = new Float32Array(NBULB); bPh = new Float32Array(NBULB);
  bSpd = new Float32Array(NBULB); bGl = new Uint8Array(NBULB); bCol = new Uint32Array(NBULB); bCh = new Uint8Array(NBULB);
  bAng = new Float32Array(NBULB); bRad = new Float32Array(NBULB); bFy = new Float32Array(NBULB);
  bTier = new Uint8Array(NBULB); bGold = new Uint8Array(NBULB); bSh = new Float32Array(NBULB);
  const bulbGl = [c_at, c_o, c_star, c_0];
  const keptR = [], keptG = [];
  for (let i = 0; i < NBULB; i++) {
    const b = B[i];
    bOn[i] = b.on; bHue[i] = b.hue; bPh[i] = rng() * TAU; bSpd[i] = 1.6 + 3.2 * rng();
    bGl[i] = bulbGl[Math.floor(rng() * 4)];

/* ============================== drawing: night sky and snow ============================== */
function drawSnow() {
  /* far behind the snow, the stars of the night sky: they stay where they are and twinkle slowly */
  const ns = Math.round(110 * gcols / COLS);
  for (let i = 0; i < ns; i++) {
    const b = h2(i, 61), tw = 0.55 + 0.45 * Math.sin(tReal * (0.5 + 1.6 * h2(i, 67)) + i * 2.4);
    const y = h2(i, 23) * h2(i, 29) * rows * 0.8;
    put(h2(i, 11) * gcols, y, b > 0.93 ? c_star : b > 0.78 ? c_plus : c_dot,
      rgba(206 + 40 * h2(i, 41), 218 + 24 * h2(i, 43), 255, (0.25 + 0.65 * b) * tw), -1001);
  }

  for (let i = 0; i < EXN; i++) {

function emitSnow(dt) {
  const now = performance.now() / 1000;
  if (now - snowSeen > 1.2 || snowRate <= 0) { snowAcc = 0; return; }
  snowAcc += snowRate * dt;
  while (snowAcc >= 1) {
    snowAcc -= 1;
    const i = exHead; exHead = (exHead + 1) % EXN;
    /* born in a band about two fifths of the stage wide, centred on the hand. In the split view the band sits
       at the top edge of the part of the scene that is shown, so the snow is there at once */
    exX[i] = extra + snowU * COLS + (Math.random() + Math.random() - 1) * 25;
    exY[i] = splitView ? SCENE_Y0 * rows - 3 + Math.random() * 11 : snowVv * rows - 2 - Math.random() * 8;
    exT[i] = tReal;

    const d = Math.random();

/* ---- the star magic circle ----
   pale blue-violet light on the snow. One large five-pointed star lies around the trunk, drawn as nested
   outlines; on every beat two waves of light leave the trunk and run outward along those nested stars.
   Around it: a sunburst of fine rays, a band that carries a procession of small stars, and a double rim.
   The lines send a faint curtain of light upward, so the circle looks lit from within.
   It runs off both sides of the portrait stage on purpose, so it reads as a floor. */
const RD = 0.8 * COLS, NCHARM = 18;
let stageFlashT = -99, landReal = -99;
const SGT = new Float32Array(722);
let sigilR = 1;
(function () {
  /* polar outline of a five-pointed star, one point up: outer radius 1, inner radius 0.46 */
  const ri = 0.46, a36 = Math.PI / 5, bx = Math.cos(a36), by = Math.sin(a36);
  for (let i = 0; i < 722; i++) {
    let t = (i / 720 * TAU) % (2 * a36);
    if (t > a36) t = 2 * a36 - t;
    /* t runs from a point (0) to the next valley (36 degrees) */
    const u = a36 - t;
    SGT[i] = ri * by / (Math.cos(u) * by - Math.sin(u) * (bx - ri));
  }
})();
/* how far out a point lies on the star: 1 on the outline, less inside */
function sigilK(ux, uy) {
  let a = Math.atan2(ux, uy);
  if (a < 0) a += TAU;
  const p = a / TAU * 720, i = p | 0;
  sigilR = SGT[i] + (SGT[i + 1] - SGT[i]) * (p - i);
  return Math.sqrt(ux * ux + uy * uy) / sigilR;
}

function drawDisc(rot) {
  const tau = T - 0.39;
  if (tau < 0) return;
  const spread = RD * 1.06 * easeOutCubic(tau / 1.0);
  const y0 = Math.max(0, Math.ceil(floorRow - RD * ftilt)), y1 = Math.min(rows - 1, Math.floor(floorRow + RD * ftilt));
  const x0 = Math.max(0, Math.ceil(cxc - RD)), x1 = Math.min(gcols - 1, Math.floor(cxc + RD));
  const landF = Math.exp(-Math.max(0, tReal - landReal) * 2.6) * (tReal >= landReal ? 1 : 0);
  const sAge = tReal - stageFlashT;
  const sflash = sAge >= 0 ? Math.exp(-sAge * 2.4) : 0, sRing = sAge * 120;
  const settled = smooth((tau - 0.9) / 0.6);
  const igniteK = tau < 1.7 ? 1 - tau / 1.7 : 0;
  const bp = fract(tReal / 1.7), bp2 = fract(tReal / 1.7 - 0.17);
  const kw1 = bp * 1.25, kw2 = bp2 * 1.25, ka1 = (1 - bp) * settled, ka2 = (1 - bp2) * 0.7 * settled;
  const beat = (Math.exp(-Math.pow((bp - 0.04) / 0.05, 2)) + 0.7 * Math.exp(-Math.pow((bp - 0.21) / 0.06, 2))) * settled;
  const sweepA = tReal * 0.45, tk = Math.floor(tReal * 6), tk2 = Math.floor(tReal * 3);
  const r1 = RD * clamp01(tau / 0.6), r2 = RD * clamp01((tau - 0.15) / 0.6), r3 = RD * clamp01((tau - 0.3) / 0.6);
  const rowTol = 0.5 / ftilt;
  const HSX = 36, HSY = 10.5, hRow = floorRow + 1.5;
  for (let y = y0; y <= y1; y++) {
    const dz = (y - floorRow) / ftilt;
    const uy = -(y - hRow) / HSY;
    for (let x = x0; x <= x1; x++) {
      const dx = x - cxc, d = Math.sqrt(dx * dx + dz * dz);
      if (d > RD || d > spread) continue;
      const rho = d / RD, inv = 1 / (d + 0.001);
      const tol = Math.abs(dz) * inv * rowTol / RD, tolL = Math.abs(dx) * inv * rowTol * 0.6;
      const ths = Math.atan2(dx, dz);
      let ch = 0, L = 0, hue = 216, S = 0.85, al = 1, kind = 0;
      if (rho >= 0.957 - tol * 0.3) { ch = c_hash; L = 0.86; kind = 1; }
      else if (Math.abs(rho - 0.93) < 0.006 + tol * 0.45) { ch = c_eq; L = 0.72; kind = 2; }
      else if (Math.abs(rho - 0.812) < 0.005 + tol * 0.45) { ch = c_eq; L = 0.76; kind = 2; }
      else if (rho > 0.812 && rho < 0.93) {
        /* between the small stars: a diamond and two dots */
        const tb = (ths + rot * 0.5) * NCHARM / TAU, s = tb - Math.round(tb);
        const lat = Math.abs(s) * TAU / NCHARM * d, rad = Math.abs(d - RD * 0.871);
        if (lat / 2.6 + rad / (2.2 + tol * RD) < 1) { ch = c_plus; L = 0.78; kind = 2; }
        else if (Math.abs(lat - 6) < 0.8 && rad < 1 + tol * RD * 0.7) { ch = c_dot; L = 0.7; kind = 2; }
      } else {
        const ux = dx / HSX;
        const k = sigilK(ux, uy);
        const hr = Math.sqrt(ux * ux + uy * uy) + 0.001;
        const tolK = 0.5 * (Math.abs(ux) / hr / HSX + Math.abs(uy) / hr / HSY) / sigilR;
        if (Math.abs(k - 1) < tolK * 1.45) { ch = c_at; L = 0.95; kind = 3; }
        else if (k < 1) {
          if (Math.abs(k - 0.86) < tolK * 0.9) { ch = c_hash; L = 0.8; kind = 4; }
          else if (Math.abs(k - 0.64) < tolK * 0.8) { if ((x & 1) === 0) { ch = c_plus; L = 0.88; kind = 4; } }
          else if (Math.abs(k - 0.4) < tolK * 0.8) { ch = c_colon; L = 0.86; kind = 4; }
          else if (k < 0.16) { ch = c_star; L = 0.86; kind = 4; }
          else if (((x + y * 2) & 3) === 0) { ch = c_dot; L = 0.8; al = 0.5; kind = 5; }
          /* the beat: two waves run outward along the nested stars */
          let wv = 0;
          const w1 = Math.abs(k - kw1), w2 = Math.abs(k - kw2);
          if (w1 < 0.09) wv = (1 - w1 / 0.09) * ka1;
          if (w2 < 0.09) { const v = (1 - w2 / 0.09) * ka2; if (v > wv) wv = v; }
          if (wv > 0.05) {
            if (!ch || kind === 5) { if (((x + y) & 1) === 0 || wv > 0.6) { ch = wv > 0.6 ? c_star : c_colon; L = 0.72; al = 1; kind = 4; } }
            L += 0.24 * wv;
          }
        } else if (rho < 0.8) {
          /* sunburst: long and short rays by turns, and two fine dotted circles */
          /* a dotted echo of the star just outside its outline */
          if (Math.abs(k - 1.15) < tolK * 0.7) { if ((x & 1) === 0) { ch = c_colon; L = 0.84; kind = 6; } }
          const tb = (ths - rot * 0.25) * 60 / TAU, rb = Math.round(tb), s = tb - rb;
          const lat = Math.abs(s) * TAU / 60 * d;
          if (kind) { kind = 6; }
          else if (lat < 0.55 + tolL * 0.45 && k > 1.24 && ((rb & 1) === 0 || rho > 0.62)) {
            if ((rb & 3) === 0) { ch = c_colon; L = 0.86; } else { ch = c_dot; L = 0.8; }
            kind = 6;
          } else if (Math.abs(rho - 0.7) < 0.004 + tol * 0.4 && k > 1.08) { if ((x & 1) === 0) { ch = c_minus; L = 0.7; kind = 6; } }
          else if (Math.abs(rho - 0.6) < 0.004 + tol * 0.4 && k > 1.08) { if ((x % 3) === 0) { ch = c_dot; L = 0.72; kind = 6; } }
        }
      }
      if (kind) {
        L *= 0.9 + 0.1 * (dz / RD);
        if (kind === 1 || kind === 2) {
          let dd = ths - sweepA;
          dd -= Math.round(dd / TAU) * TAU;
          L += settled * 0.14 * Math.max(0, 1 - Math.abs(dd) / 0.5);
        } else if (kind === 3) {
          L += 0.05 * beat;
          if (h3(x, y, tk) < 0.03 * settled) { ch = c_star; L = 0.97; }
        }
        if (kind !== 5 && kind !== 7 && h3(x, y, tk2) < 0.006 * settled) { ch = c_star; L = 0.96; al = 1; }
        L += 0.2 * landF + 0.16 * sflash;
        if (sRing < RD * 1.1 && Math.abs(d - sRing) < 6) L += 0.22 * (1 - Math.abs(d - sRing) / 6);
        if (igniteK > 0) L += 0.3 * igniteK * Math.exp(-(spread - d) / 18);
      }
      if (tau < 1.2) {
        if (spread - d < 4) { ch = c_hash; L = 0.97; al = 1; kind = 8; }
        else if (tau < 1) {
          const tw = 1.6 + tol * RD * 0.6;
          if ((r1 > 0 && r1 < RD * 0.99 && Math.abs(d - r1) < tw) || (r2 > 0 && r2 < RD * 0.99 && Math.abs(d - r2) < tw) ||
              (r3 > 0 && r3 < RD * 0.99 && Math.abs(d - r3) < tw)) {
            ch = c_hash; al = 1; kind = 8; L = Math.max(L, 0.66 + 0.3 * (1 - tau));
          }
        }
      }
      if (!ch) continue;
      /* every line is lifted toward white but never reaches it, so even the brightest strokes stay a pale light blue */
      put(x, y, ch, hsl(hue, S, Math.min(0.915, L + (1 - L) * 0.28), al), -500);
      /* the bright lines throw a thin curtain of light upward */
      if ((kind === 3 || kind === 1) && settled > 0) {
        const fl = 0.55 + 0.45 * h3(x, 3, tk2 + y);
        put(x, y - 1, c_colon, hsl(216, 0.8, 0.92, 0.42 * settled * fl), -501);
        put(x, y - 2, c_dot, hsl(216, 0.8, 0.92, 0.3 * settled * fl), -501);
        if (fl > 0.75) put(x, y - 3, c_dot, hsl(216, 0.8, 0.92, 0.18 * settled), -501);
      }
    }
  }
  /* the procession of small stars on the outer band; they stand upright so they stay readable */
  const RB = RD * 0.871;
  for (let k = 0; k < NCHARM; k++) {
    const a = (k + 0.5) / NCHARM * TAU - rot * 0.5;
    const hx = RB * Math.sin(a), hz = RB * Math.cos(a);
    if (Math.abs(hx) > 68 || RB > spread) continue;
    const cx = cxc + hx, cy = floorRow + hz * ftilt;
    const s = 4.3 + 0.6 * Math.cos(a);
    const lit = Math.max(0, Math.sin(tReal * 2.4 - k * TAU / NCHARM * 3));
    const Lh = (0.86 + 0.08 * Math.cos(a)) + 0.12 * lit * settled + 0.2 * landF + 0.14 * sflash;
    const ya = Math.floor(cy - 3.6), yb = Math.ceil(cy + 3.2), xa = Math.floor(cx - s - 1), xb = Math.ceil(cx + s + 1);
    for (let yy = ya; yy <= yb; yy++) {
      const vy = -(yy - cy) / AR / s - 0.1;
      for (let xx = xa; xx <= xb; xx++) {
        const k2 = sigilK((xx - cx) / s, vy);
        if (k2 > 1.04) continue;
        if (k2 > 0.5) put(xx, yy, c_at, hsl(216, 0.85, Math.min(0.92, Lh + 0.03)), -499);
        else put(xx, yy, c_star, hsl(224, 0.85, Math.min(0.94, Lh + 0.05)), -499);
      }
    }
  }
  addHalo(cxc, floorRow + 2, 30, (0.1 + 0.07 * beat) * settled, hsl(216, 0.8, 0.92));
  if (landF > 0.05) addHalo(cxc, floorRow, 22, 0.5 * landF, hsl(216, 0.8, 0.92));
}

function drawBurst() {
  const tau = T - 0.39;
  if (tau < 0 || tau > 1) return;
  if (tau < 0.5) addHalo(cxc, floorRow, 13, 0.75 * (1 - tau / 0.5), hsl(44, 0.6, 0.9));
  for (let i = 0; i < NBURST; i++) {
    const life = buL[i];
    if (tau >= life) continue;
    const g = 2 * buVy[i] / life;
    const hgt = buVy[i] * tau - 0.5 * g * tau * tau;
    const r = buVr[i] * tau;
    const x = cxc + r * Math.sin(buA[i]), z = r * Math.cos(buA[i]);
    const y = floorRow + z * ftilt - hgt * AR;
    const p = tau / life;
    put(x, y, p < 0.4 ? c_star : p < 0.75 ? c_plus : c_dot, hsl(44, 0.75, 0.92 - 0.22 * p, 1 - 0.5 * p * p), z + 2);
  }
}

/* little <3 marks lift off the circle and drift upward */
function drawMotes() {
  if (T < 1.4) return;
  const fade = smooth((T - 1.4) / 0.6);
  for (let i = 0; i < NMOTE; i++) {
    const cyc = tReal * (0.1 + 0.05 * moP[i]) + moP[i] * 7;
    const n = Math.floor(cyc), p = cyc - n;
    const a = h2(i, n) * TAU, R = 34 + 50 * h2(i + 40, n);
    const zf = R * Math.cos(a);
    const x = Math.round(cxc + R * Math.sin(a) + Math.sin(tReal * 0.8 + i) * 1.2);
    const y = Math.round(floorRow + zf * ftilt - 1 - p * 11);
    const col = hsl(216, 0.8, 0.9, Math.sin(Math.PI * p) * 0.9 * fade);
    const z = zf > 0 ? 70 : -400;
    put(x, y, c_star, col, z);
  }
}

const TRUNK_GL = [c_hash, c_8, c_pct, c_at];
function drawTrunk() {
  if (T < 1.05) return;
  const topRow = Math.round(baseRow + 0.035 * treeH), botRow = Math.round(floorRow);
  const n = botRow - topRow + 1;
  const p = clamp01((T - 1.05) / 0.45);
  const vis = Math.min(n, Math.floor(p * n + 1e-6));
  const cx = Math.round(cxc);
  for (let i = 0; i < vis; i++) {
    const y = botRow - i;
    const halfW = 3.5 + 0.8 * (1 - i / n) + (i < 3 ? (3 - i) * 0.3 : 0);
    const hw = Math.ceil(halfW);
    for (let dx = -hw; dx <= hw; dx++) {
      if (Math.abs(dx) > halfW) continue;
      const u = dx / halfW;
      const sh = Math.max(0, 1 - Math.pow((u + 0.3) / 0.95, 2));
      let L = (0.1 + 0.2 * sh) * (0.78 + 0.44 * h2(cx + dx + 9, y * 3 + 1));
      if (p < 1 && i >= vis - 2) L += 0.07;
      const gk = i < 7 && T > 1.2 ? 1 - i / 7 : 0;
      put(cx + dx, y, TRUNK_GL[Math.floor(h2(cx + dx, y) * 4)], hsl(24 - 4 * gk, 0.4 - 0.16 * gk, L + 0.12 * gk), 3 * (1 - u * u) + 0.5);
    }
  }
}

/* ============================== drawing: tree, baubles, lights ============================== */
/* every cell shows the average of the points on its front surface, so the shading is smooth instead of noisy.
   colour is built in layers: a green ramp that runs from teal shadow to warm highlight, a cool rim light on the
   shadow side, frost, coloured light spilling from the nearby bulbs, the star's warm light at the top,
   and a rose glow from the magic circle on the lowest branches */
function drawTree(rot) {
  if (T <= 2.1) return;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const gc = gcols, rw = rows, tH = treeH, bR = baseRow, cx = cxc + 0.5, tl = tilt, q4 = quality, Tn = treeT, Tl = T;
  const dep = depA, cha = chA, cola = colA, dim = dimA;
  const y0 = Math.max(0, Math.floor(tipRow - 3)), y1 = Math.min(rw - 1, Math.ceil(baseRow + 16));
  const x0 = Math.max(0, Math.floor(cxc - 54)), x1 = Math.min(gc - 1, Math.ceil(cxc + 54));
  if (y1 < y0 || x1 < x0) return;
  for (let y = y0; y <= y1; y++) {
    tZ.fill(-1e9, y * gc + x0, y * gc + x1 + 1);
    tWs.fill(0, y * gc + x0, y * gc + x1 + 1);
  }
  /* when the star opens, a band of its light washes down the tree */
  const washOn = Tl > 5.86 && Tl < 6.3, fw = 1.06 - (Tl - 5.88) / 0.34 * 1.2;
  const starK = clamp01((Tl - 5.8) / 0.4) * (0.85 + 0.15 * Math.sin(tReal * 1.3));
  ringGeo(Tn);
  const slabR = rgRm * 0.95;
  let nProc = 0;
  for (let i = 0; i < NB; i++) {
    const age = Tn - pT[i];
    if (age < 0) break;
    nProc = i + 1;
    qIdx[i] = -1;
    if ((i & 3) >= q4) continue;
    let ext = 1, r = pR[i];
    if (age < 0.45) {
      /* straight under the ring the new foliage is a slab no wider than the ring; then the branches open out
         of it to their full reach and let their tips sink */
      ext = age <= 0.13 ? 0 : (age - 0.13) / 0.3;
      ext = ext * ext * (3 - 2 * ext);
      if (r > slabR) r = slabR + (r - slabR) * ext;
    }
    const sp = pSin[i] * cr + pCos[i] * sr, cp = pCos[i] * cr - pSin[i] * sr;
    /* the far half of the tree is always hidden behind the near half */
    if (cp < -0.12) continue;
    const z = r * cp;
    const x = Math.floor(cx + r * sp);
    if (x < x0 || x > x1) continue;
    const y = Math.floor(bR - (pF[i] - pDr[i] * ext * ext) * tH + z * tl + 0.5);
    if (y < y0 || y > y1) continue;
    const idx = y * gc + x;
    if (z < dep[idx]) continue;
    qIdx[i] = idx; qZ[i] = z; qSp[i] = sp; qCp[i] = cp; qExt[i] = age;
    if (z > tZ[idx]) tZ[idx] = z;
  }
  /* second pass: only the points on the front surface are shaded */
  for (let i = 0; i < nProc; i++) {
    const idx = qIdx[i];
    if (idx < 0) continue;
    const z = qZ[i];
    if (z < tZ[idx] - 2.2) continue;
    const sp = qSp[i], cp = qCp[i], age = qExt[i];
    const w = 0.5 - 0.5 * sp;
    const light = 0.03 + 0.97 * w * Math.sqrt(w) + 0.04 * cp;
    const b = pB[i] * 0.003921569;
    let bb = b * (0.16 + 0.92 * light);
    let fr = 0;
    /* snow lies on a patch when its own level passes a threshold that drops toward the lit side */
    if (pFr[i] !== 0 && w > 0.46) { const fd = (w - 0.46) * 1.5; if (pFr[i] * 0.003921569 > 1 - (fd > 0.66 ? 0.66 : fd)) fr = 1; }
    let young = 0, mat = 1;
    if (age < 0.42) {
      /* under the ring the newest foliage is a cap of fresh green, lit from the left and without any shadow
         of its own yet; the shading of the tiers settles into it during the following third of a second */
      mat = age <= 0.12 ? 0 : (age - 0.12) / 0.3;
      mat = mat * mat * (3 - 2 * mat);
      const yb = 0.22 + 0.5 * w * Math.sqrt(w);
      bb = yb + (bb - yb) * mat;
      if (age < 0.13) young = 1;
    }
    if (washOn) {
      const dw = Math.abs(pF[i] - fw);
      if (dw < 0.1) { const k = 1 - dw / 0.1; bb += 0.4 * k; if (fr < 0.5 * k) fr = 0.5 * k; }
    }
    const dm = dim[idx];
    bb *= dm; fr *= dm;
    if (bb > 1) bb = 1;
    const li = pHv[i] * 64 + ((bb * 63) | 0);
    let r0 = gR[li], g0 = gG[li], b0 = gBl[li];
    /* cool rim light on the shadow side */
    if (sp > 0.4) {
      const k = (sp - 0.4) * (1 - 0.75 * cp) * b * 0.28 * dm * mat;
      r0 += 26 * k; g0 += 58 * k; b0 += 128 * k;
    }
    /* light spilling from the nearby bulbs */
    const ts = pTintS[i];
    if (ts !== 0 && Tl > pTintT[i]) {
      let k = (Tl - pTintT[i]) * 2;
      if (k > 1) k = 1;
      k *= ts * 0.003921569 * dm;
      const tc = pTintC[i];
      r0 += (((tc >> 16) & 255) - r0) * k; g0 += (((tc >> 8) & 255) - g0) * k; b0 += ((tc & 255) - b0) * k;
      if (bb < 0.6 * k) bb = 0.6 * k;
    }
    /* the star warms the top of the tree */
    if (starK > 0 && pF[i] > 0.76) {
      const k = (pF[i] - 0.76) * 1.7 * starK * dm * (0.4 + 0.6 * b);
      r0 += (255 - r0) * k; g0 += (240 - g0) * k; b0 += (206 - b0) * k;
    }
    const band = bb;
    if (tWs[idx] === 0) {
      tRs[idx] = r0; tGs[idx] = g0; tBs[idx] = b0; tBd[idx] = band; tYg[idx] = young; tFs[idx] = fr; tAg[idx] = age > 3 ? 3 : age; tWs[idx] = 1;
    } else {
      tRs[idx] += r0; tGs[idx] += g0; tBs[idx] += b0; tBd[idx] += band; tYg[idx] += young; tFs[idx] += fr; tAg[idx] += age > 3 ? 3 : age; tWs[idx] += 1;
    }
  }
  const glowRow = baseRow - 1, glowK = 0.07 + 0.02 * Math.sin(tReal * 3.7);
  for (let y = y0; y <= y1; y++) {
    /* the magic circle glows up onto the underside of the lowest branches */
    const ug = y > glowRow ? Math.min(1, (y - glowRow) / 7) * glowK : 0;
    for (let x = x0; x <= x1; x++) {
      const idx = y * gc + x, ws = tWs[idx];
      if (ws === 0) continue;
      const inv = 1 / ws;
      /* frost comes last and not all at once: every cell waits its own while after the foliage has formed */
      const snow = tAg[idx] * inv > 0.34 + 0.4 * h2(x * 13 + 5, y * 7 + 3) ? tFs[idx] * inv * dim[idx] : 0;
      const gn = h2(x, y);
      let gi = ((snow > 0.5 ? 0.72 + 0.3 * gn : tBd[idx] * inv + (gn - 0.5) * 0.36) * 4.999) | 0;
      if (gi < 0) gi = 0; else if (gi > 4) gi = 4;
      let rr = tRs[idx] * inv, gg = tGs[idx] * inv, bl = tBs[idx] * inv;
      /* no two neighbouring cells are quite the same green */
      const cn = 0.76 + 0.48 * h2(x * 5 + 11, y * 3 + 7);
      rr *= cn; gg *= cn; bl *= cn;
      if (snow > 0.5) {
        const sv = h2(x * 7 + 3, y * 5 + 1);
        if (sv < 0.26) { rr += (248 - rr) * 0.92; gg += (251 - gg) * 0.92; bl += (248 - bl) * 0.92; }
        else if (sv < 0.56) { const k = 0.55 + 0.5 * sv; rr += (156 - rr) * k; gg += (232 - gg) * k; bl += (200 - bl) * k; }
        else if (sv < 0.78) { const k = 0.2 + 0.7 * sv; rr += (204 - rr) * k; gg += (240 - gg) * k; bl += (172 - bl) * k; }
        else { rr = rr * 1.2 + 14; gg = gg * 1.2 + 30; bl = bl * 1.2 + 20; }
      }
      else if (snow > 0.2) { const k = (snow - 0.2) * 0.9; rr += (214 - rr) * k; gg += (240 - gg) * k; bl += (226 - bl) * k; }
      if (ug > 0) { const k = ug * dim[idx]; rr += (208 - rr) * k; gg += (224 - gg) * k; bl += (255 - bl) * k; }
      dep[idx] = tZ[idx];
      /* between the fresh slab and the finished foliage there is a moment of loose dots */
      cha[idx] = tYg[idx] * inv > 0.5 ? c_hash : tAg[idx] * inv < 0.19 ? (gn < 0.45 ? c_dot : c_hash) : snow > 0.5 && gn < 0.22 ? c_8 : TREE_GLYPHS[gi];
      cola[idx] = (0xff000000 | ((rr > 255 ? 255 : rr) << 16) | ((gg > 255 ? 255 : gg) << 8) | (bl > 255 ? 255 : bl)) >>> 0;
    }
  }
  /* a very rare white sparkle on the body */
  const key = Math.floor(tReal * 7);
  for (let s = 0; s < 3; s++) {
    if (h2(key, s * 13 + 1) > 0.22) continue;
    const i = Math.floor(h2(key + 5, s + 2) * NB);
    if (T - pT[i] < 1.3) continue;
    const sp = pSin[i] * cr + pCos[i] * sr, cp = pCos[i] * cr - pSin[i] * sr;
    if (cp < 0.3) continue;
    const z = pR[i] * cp, x = Math.floor(cx + pR[i] * sp), y = Math.floor(bR - (pF[i] - pDr[i]) * tH + z * tl + 0.5);
    if (x < 0 || x >= gc || y < 0 || y >= rw) continue;
    const idx = y * gc + x;
    if (z >= dep[idx] - 1 && dim[idx] > 0.9) { cha[idx] = c_star; cola[idx] = WHITE; }
  }
}

function drawBaubles(rot) {
  if (T <= 2.1) return;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < baubles.length; i++) {
    const b = baubles[i];
    const age = treeT - b.t;
    if (age < 0) continue;
    const sp = b.s * cr + b.c * sr, cp = b.c * cr - b.s * sr;
    if (cp < -0.15) continue;
    const z = b.r * cp + 1.5;
    const drop = (easeOutBack(age / 0.5) - 1) * 5;
    const x = Math.round(cxc + b.r * sp), y = Math.round(baseRow - b.fy * treeH + z * tilt + 1 + drop);
    const w = 0.5 - 0.5 * sp;
    const ci = y >= 0 && y < rows && x >= 0 && x < gcols ? dimA[y * gcols + x] : 1;
    if (ci < 0.6) continue;
    const L = (0.2 + 0.34 * w) * ci;
    const c1 = hsl(354, 0.8, L + 0.06), c2 = hsl(354, 0.8, L);
    put(x - 1, y, c_at, c1, z); put(x, y, c_at, c1, z); put(x + 1, y, c_at, c2, z);
    put(x - 1, y + 1, c_at, c2, z); put(x, y + 1, c_O, hsl(354, 0.8, L + 0.12), z); put(x + 1, y + 1, c_at, hsl(354, 0.8, L * 0.8), z);
    if (ci > 0.9) put(x - 1, y, c_star, rgba(255, 244, 240), z + 0.1);
  }
}

const LIGHT_GL = [c_o, c_0, c_at, c_star, c_8, c_o, c_0, c_star];
function drawLights(rot) {
  if (T < 6.25) return;
  const tk = Math.floor(tReal * 1.6);
  for (let b = 0; b < NBULB; b++) {
    const age = T - bOn[b];
    if (age < 0) { bCol[b] = 0; continue; }
    const fl = Math.exp(-age * 7);
    const tw = 0.5 + 0.5 * Math.sin(tReal * bSpd[b] + bPh[b]);
    let L = 0.67 + 0.13 * bSh[b] + 0.05 * tw;
    if (h3(b, 7, tk + Math.floor(bPh[b] * 10)) < 0.07) L -= 0.1;
    L += (0.95 - L) * fl;
    bCol[b] = hsl(bHue[b], 0.84 - 0.1 * bSh[b], L);
    bCh[b] = fl > 0.45 ? c_at : bGl[b];
  }
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const gc = gcols, rw = rows, cx = cxc + 0.5;
  for (let i = 0; i < NL; i++) {
    const col = bCol[lB[i]];
    if (col === 0) continue;
    const sp = lSin[i] * cr + lCos[i] * sr, cp = lCos[i] * cr - lSin[i] * sr;
    const z = lR[i] * cp + 0.8;
    const x = Math.floor(cx + lR[i] * sp);
    if (x < 0 || x >= gc) continue;
    const y = Math.floor(baseRow - lFy[i] * treeH + z * tilt + 0.5);
    if (y < 0 || y >= rw) continue;
    const idx = y * gc + x;
    if (z < depA[idx] || dimA[idx] < 0.97) continue;
    depA[idx] = z; chA[idx] = bCh[lB[i]] === c_at ? c_at : LIGHT_GL[i & 7]; colA[idx] = col;
  }
}

/* ============================== drawing: ring, star, comets ============================== */
/* the growth ring: a fat, soft doughnut of light that rides on the growing top of the tree.
   Colour runs along the ring, not across it: twice round the colour wheel in one turn, so on the far half it
   goes green, butter, pink, violet from left to right and on the near half violet, pink, peach, green, teal.
   The rows of the tube differ mainly in depth of tone: it is shaded like a real tube lit from above, dim on its
   outer rows, white next to the hole on the far half and through the middle on the near half. Small ripples of
   hue break the near half into shorter runs, and the whole pattern drifts round the ring all the time.
   It opens wide around the foot of the tree and then draws in to the width of the growing top. */
const RING_STOPS = [22, 240, 176, 138, 56, 236, 232, 168, 76, 160, 168, 108, 104, 132, 150, 96, 128, 118, 190, 128,
  156, 112, 164, 148, 180, 140, 214, 214, 204, 120, 176, 226, 222, 124, 150, 228, 254, 150, 128, 222,
  276, 196, 160, 232, 300, 176, 124, 170, 318, 214, 120, 176, 338, 232, 152, 186, 382, 240, 176, 138];
const RING_LUT = new Uint8Array(360 * 3);
(function () {
  const n = RING_STOPS.length / 4;
  for (let h = 0; h < 360; h++) {
    const hh = h < 22 ? h + 360 : h;
    let i = 0;
    while (i < n - 2 && hh >= RING_STOPS[(i + 1) * 4]) i++;
    const a = i * 4, b = a + 4, f = clamp01((hh - RING_STOPS[a]) / (RING_STOPS[b] - RING_STOPS[a]));

  const notes = [-5, -3, -2, 0];
  for (let i = 0; i < 4; i++) pad(t, pent(notes[i]), 0.07, 0.5, 3.0);
  bell(t, pent(5), 0.1, 2.0, 0);
}
const GIFT_NOTES = [5, 6, 7, 8, 10];
function sGift(t, i) {
  const f0 = 240 * Math.pow(1.26, i);
  glide(t, f0, f0 * 3.2, 0.075, 0.2, 'sine', 0.004);
  noise(t, 0.03, 3000, 3000, 2, 0.07, 0.002, 0);
  bell(t + 0.06, pent(GIFT_NOTES[i]), 0.12, 1.2, (i - 2) * 0.35);
}
const SLEIGH = [2793, 2840, 3136, 3185];
function sDolphin(t) {
  for (let i = 0; i < 7; i++) bell(t + i * 0.07, pent(3 + i), 0.09, 0.9, -0.9 + i * 0.3);
  for (let j = 0; j < 8; j++) {
    const tt = t + 0.6 + j * 0.17, v = 1 - j / 9;
    noise(tt, 0.05, 6000, 6000, 3, 0.07 * v, 0.003, 0);
    for (let k = 0; k < 4; k++) bell(tt, SLEIGH[k], 0.022 * v, 0.22, j % 2 ? 0.4 : -0.4);
  }
}
const CUES = [
  [0.05, sDrop], [0.39, sLand], [1.05, sTrunk], [1.5, sRing], [2.1, sLeaves], [5.6, sStar], [6.25, sComets], [9.24, sLit],
  [9.35, t => sGift(t, 0)], [9.61, t => sGift(t, 1)], [9.87, t => sGift(t, 2)], [10.13, t => sGift(t, 3)],
  [10.39, t => sGift(t, 4)], [10.85, sDolphin]
];
/* every cue fires once when T crosses its time; if the context is not running the cue is skipped */
function runCues() {
  if (T <= prevT) return;
  const ok = audioOK();
  const at = ok ? actx.currentTime + 0.01 : 0;
  for (let i = 0; i < CUES.length; i++) {
    const c = CUES[i][0];
    if (prevT <= c && T > c && ok) CUES[i][1](at);
  }
  if (T > 2.1 && T < 5.7) {
    const F = Math.min(1, growF(T));
    const st = Math.floor(F * 40), gr = Math.floor(F * 70);
    if (st > lastStep) {
      lastStep = st;
      if (ok && Math.random() < 0.75) bell(at, pent(8 + Math.floor(Math.random() * 8)), 0.035, 0.9, Math.random() * 2 - 1);
    }
    if (gr > lastGrain) {
      lastGrain = gr;
      if (ok) { const f = 3000 + Math.random() * 4000; noise(at, 0.05, f, f, 2, 0.02, 0.008, Math.random() - 0.5); }
    }
  }
}

/* ============================== input and start ============================== */
window.addEventListener('keydown', e => {
  const k = e.key;
  wakeAudio();
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'r' || k === 'R') resetFilm();
  else if (k.length === 1 && k >= '1' && k <= '6') requestStage(k.charCodeAt(0) - 48);
  else if (k === 'd' || k === 'D') twistDir = -twistDir;
  else if (k === 't' || k === 'T') doTwist();
  else if (k === 'l' || k === 'L') setSplit(!splitView);
  else if (k === 'v' || k === 'V') { if (recorder) stopRec(); else startRec(); }
});
cv.addEventListener('pointerdown', wakeAudio);
outC.addEventListener('pointerdown', wakeAudio);

/* ---- split view and recording ---- */
let recorder = null, recChunks = [], recAudio = null;
function setSplit(on) {
  if (recorder && !on) return;
  splitView = on;
  document.body.classList.toggle('split', on);
  resize();
}
function startRec() {
  if (recorder || typeof MediaRecorder === 'undefined' || !outC.captureStream) return;
  setSplit(true);
  wakeAudio();
  /* the recording starts with the empty scene, so the film is taken back to its beginning */
  resetFilm();
  const stream = outC.captureStream(30);
  if (actx && masterOut) {
    if (!recAudio) { recAudio = actx.createMediaStreamDestination(); masterOut.connect(recAudio); }
    const tracks = recAudio.stream.getAudioTracks();
    for (let i = 0; i < tracks.length; i++) stream.addTrack(tracks[i]);
  }
  const kinds = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  let kind = '';
  for (let i = 0; i < kinds.length; i++) if (MediaRecorder.isTypeSupported(kinds[i])) { kind = kinds[i]; break; }
  try {
    recorder = new MediaRecorder(stream, kind ? { mimeType: kind, videoBitsPerSecond: 12000000 } : { videoBitsPerSecond: 12000000 });
  } catch (err) {
    recorder = null;
    return;
  }
  recChunks = [];
  const rec = recorder;
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    const type = rec.mimeType || kind || 'video/webm';
    const blob = new Blob(recChunks, { type: type });
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ascii-tree-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) +
      (type.indexOf('mp4') >= 0 ? '.mp4' : '.webm');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    recChunks = [];
    recorder = null;
    document.body.classList.remove('rec');
  };
  rec.start(1000);
  document.body.classList.add('rec');
}
function stopRec() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
document.getElementById('bSplit').addEventListener('click', e => { e.currentTarget.blur(); setSplit(!splitView); });
document.getElementById('bRec').addEventListener('click', e => { e.currentTarget.blur(); if (recorder) stopRec(); else startRec(); });
window.addEventListener('load', begin);
window.addEventListener('resize', resize);

genTree();
genMisc();
genGifts();
resize();
requestAnimationFrame(frame);
</script>
